<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a2e;--mute:#66757a;--line:#e3ded3;--pri:#0f6b5c;--pri-ink:#fff;--ok:#1b7f4b;--ok-soft:#dff3e7;--bad:#b3392f;--bad-soft:#fbe5e2;--warn:#8a5a00;--warn-soft:#fdf0d5;--r:14px;

@media (prefers-color-scheme:dark){:root{--bg:#121719;--card:#1b2326;--ink:#e8eeef;--mute:#9db0b4;--line:#2b383c;--pri:#3dbba4;--pri-ink:#06211c;--ok:#59d08d;--ok-soft:#173826;--bad:#ff8d82;--bad-soft:#3d1f1c;--warn:#f0b64a;--warn-soft:#3a2d10}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
/* Một màn hình, không cuộn: khung cao đúng bằng cửa sổ; chỉ cuộn bên trong khi màn hình quá thấp */
.wrap{height:100vh;height:100dvh;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto;scrollbar-width:thin}
h1{font-size:1.3em;margin:0;line-height:1.2}h3{font-size:1.05em;margin:0 0 .4em}
.mute{color:var(--mute)}.small{font-size:.88em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(10px,2vh,18px);margin:0}
button,select{font:inherit;color:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:.5em .9em;min-height:max(42px,2.5em)}
button{cursor:pointer}button:hover{border-color:var(--pri)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:650}
.big{width:100%;min-height:max(46px,2.8em);font-size:1.05em}
.row.nowrap{flex-wrap:nowrap}.row.nowrap>button{padding:.5em .7em;white-space:nowrap}.row.nowrap>.grow{flex:1 1 auto;min-width:0}
.sm{min-height:36px;padding:.15em .7em;font-size:.88em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1 1 130px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);transition:width .25s}
.prompt{font-size:1.45em;font-weight:700;line-height:1.3;margin:.3em 0}
.ans{font-size:1.3em;font-weight:700;margin:.2em 0;overflow-wrap:anywhere}
input[type=text]{font:inherit;font-size:1.15em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5em .7em;width:100%;min-height:max(46px,2.7em)}
.fb{border-radius:12px;padding:.5em .8em;margin:0}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.hint{background:var(--warn-soft);color:var(--warn);padding:.5em .8em;border-radius:12px;margin:.4em 0}
.tag{display:inline-block;font-size:.75em;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--mute);margin-right:4px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5em .2em;text-align:center}
.stat b{display:block;font-size:1.35em;line-height:1.2}.stat span{font-size:.8em;color:var(--mute)}
ul.w{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:.5em 0 0;padding:0}
ul.w li{background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:1px 10px;font-size:.85em;overflow-wrap:anywhere}
ul.w li.more{background:none;color:var(--mute)}
.home{flex:1;min-height:0;display:flex;flex-direction:column;gap:inherit}
.col{display:flex;flex-direction:column;gap:inherit;min-height:0}
@media (orientation:landscape) and (min-width:760px){.home{display:grid;grid-template-columns:1.05fr .95fr;align-content:start;align-items:start;gap:20px}}
.sess{flex:1;min-height:0;display:flex;flex-direction:column;gap:inherit}
.sess>.row.top{flex:none;flex-wrap:nowrap}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:inherit;width:100%;max-width:760px;margin:0 auto;overflow-y:auto;scrollbar-width:thin}
details.pop{position:relative;flex:none}
details.pop>summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--mute);list-style:none}
details.pop>summary::-webkit-details-marker{display:none}
.popbody{max-height:82vh;overflow-y:auto;position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,420px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:20}
.use{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}.ue{margin-top:4px;line-height:1.3}.up{font-weight:700;color:var(--pri);overflow-wrap:anywhere}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;user-select:all;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;font-size:.95em}
</style>

<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const dayStr=n=>new Date(n*86400000).toISOString().slice(0,10);
let toastT;function toast(m){const t=$('#toast');t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',2600)}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

/* ===== Lưu trữ =====
   progress[id] = {b: bậc nhớ 0-4, d: ngày ôn kế tiếp, l: ngày đã xong gần nhất}  */
const KEY='sotay_v1';let storageOK=true;
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){storageOK=false;return{}}}
const st=Object.assign({progress:{},done:{},log:{}},loadState());
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){storageOK=false}syncSoon()}

/* ===== Dữ liệu ===== */
const INT=[0,1,3,7,14];           // sau lần đúng đầu tiên: bậc 1 → mai, 2 → 3 ngày, 3 → 7 ngày, 4 → 14 ngày
const VERB='Động từ bất quy tắc';
const idOf=en=>en.toLowerCase().replace(/[‘’']/g,"'").replace(/\s+/g,' ').trim();
const ITEMS=(window.ITEMS||[]).map((x,i)=>({...x,id:x.d+'|'+idOf(x.en),i}));

function formOf(x){
  if(x.t===VERB||x.t==='Từ mới')return'';
  const e=x.en.replace(/\\u0027/g,"'").toLowerCase(),sl=e.includes(' / ');
  if(/\bhave\s*\/\s*has been\b|\bhas been\b|\bhave been \+?\s*v-?ing/.test(e))return'hiện tại hoàn thành tiếp diễn';
  if(/\bhave you (ever|\+ v3)|\bhaven'?t\b.*v3|have\s*\/\s*has \+ v3/.test(e))return'hiện tại hoàn thành';
  if(/\b(was|were)\b.*\bv3\b|\bwhy was\b/.test(e))return'bị động, quá khứ';
  if(/^be born\b|^born\b/.test(e))return'quá khứ';
  if(/^if i were/.test(e))return'câu điều kiện loại 2';
  if(!sl&&/\b(was|were|had)\b|\bv2\b/.test(e))return'quá khứ đơn';
  if(/\bbe\s*\+\s*v-?ing|^be going\b|\bis \+ v-?ing/.test(e))return'hiện tại tiếp diễn';
  if(/\b(does|do|doesn'?t|don'?t)\b|\bs \+ has\b/.test(e))return'hiện tại đơn';
  if(/^(be|am|is|are)\b/.test(e))return'hiện tại đơn';
  if(/^have\b/.test(e)&&!/^have you/.test(e))return'hiện tại đơn';
  if(VERBS.has(e.split(/\s+/)[0]))return'động từ nguyên mẫu';
  return'';
}

  return s.split(/[^\p{L}\p{N}]+/u).filter(t=>t&&!PH.has(t)&&!VI_RX.test(t));
}
function altsOf(en){
  const s=en.replace(/…|\.\.\./g,' ');let variants=[s];
  const m=s.match(/\(([^)]*)\)/);
  if(m){const without=s.replace(m[0],' ');variants=VI_RX.test(m[1])?[without]:[without,s.replace(m[0],m[1])]}
  const out=[],seen=new Set();
  variants.forEach(v=>v.split(/\s\/\s/).forEach(a=>{const t=tokens(a);if(t.length){const k=t.join(' ');if(!seen.has(k)){seen.add(k);out.push(t)}}}));
  variants.forEach(v=>{const t=tokens(v.replace(/\//g,' '));if(t.length){const k=t.join(' ');if(!seen.has(k)){seen.add(k);out.push(t)}}});
  return out;
}
function verbAlts(en){
  const segs=en.split(/\s+-\s+/).map(sg=>sg.split(/\s*\/\s*/).map(w=>tokens(w).join(' ')).filter(Boolean));
  if(!segs.length||segs.some(x=>!x.length))return[];
  let combos=[[]];segs.forEach(opts=>{const nx=[];combos.forEach(c=>opts.forEach(o=>nx.push(c.concat(o.split(' ')))));combos=nx});
  combos.push(segs.map(o=>o.join(' ')).join(' ').split(' '));
  return combos;
}
const hasPH=en=>/[+]|\bsb\b|\bsth\b|\bV\b|\bS\b|ing\b|\.\.\.|…/.test(en)||VI_RX.test(en);
function isSubseq(a,u){let i=0;for(const t of u){if(t===a[i])i++;if(i===a.length)return true}return false}
function checkAnswer(it,inp){
  const alts=it.t===VERB?verbAlts(it.en):altsOf(it.en).concat(it.xa||[]);
  if(!alts.length)return{self:true};
  const u=tokens(inp);if(!u.length)return{empty:true};
  const uj=u.join(' ');
  if(alts.some(a=>a.join(' ')===uj))return{ok:true};
  const okp=(USE[ukey(it)]||{}).ok||[],badPrep=a=>u.some(t=>PREP.has(t)&&!a.includes(t)&&!okp.includes(t));
  if(it.t!==VERB&&hasPH(it.en)&&alts.some(a=>isSubseq(a,u)&&u.length-a.length<=3&&!badPrep(a)))return{ok:true,extra:true};
  // cụm cốt lõi đúng và đủ, thêm phía sau: chỉ đúng nếu giới từ thêm vào nằm trong danh sách cho phép của mục đó
  if(it.t!==VERB){const hit=alts.find(a=>a.length>=2&&u.length>a.length&&u.length-a.length<=4&&a.every((t,i)=>u[i]===t)&&!badPrep(a));
    if(hit)return{ok:true,ext:u.slice(hit.length).join(' ')}}
  let best=null;
  alts.forEach(a=>{const rest=u.slice(),lack=[];a.forEach(t=>{const i=rest.indexOf(t);if(i>=0)rest.splice(i,1);else lack.push(t)});const sc=lack.length+rest.length;if(!best||sc<best.sc)best={sc,lack,over:rest}});
  return best&&best.sc<=Math.max(3,Math.floor(u.length/2))?{ok:false,lack:best.lack,over:best.over}:{ok:false};
}
const promptVi=it=>it.vi.split(/\.?\s*Lưu ý:/)[0].replace(/\([^)]*[A-Za-z]{3}[^)]*\)/g,'').replace(/\s+/g,' ').trim();
const noteVi=it=>{const m=it.vi.match(/Lưu ý:\s*(.*)$/);return m?m[1]:''};
function hintText(it){
  const a=(it.t===VERB?verbAlts(it.en):altsOf(it.en))[0];if(!a)return'';
  return a.map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join(' ');
}

function startDay(n){

  if(!queue.length){toast('Hôm nay không còn mục nào để ôn 🎉');return}
  S={n,queue,total:queue.length,done:new Set(),ok:0,bad:0,wrongIds:new Set(),phase:'q',hint:0};render();window.scrollTo(0,0);
}
function ensureProg(x){let p=prog(x.id);if(!p)p=st.progress[x.id]={b:0,d:today()};return p}
function shell(inner){const pct=Math.round(100*S.done.size/S.total);
  return'<div class="sess"><div class="row top"><button class="sm" data-a="exit" aria-label="Thoát">✕</button><div class="grow"><div class="bar"><i style="width:'+pct+'%"></i></div></div><span class="small mute">'+S.done.size+'/'+S.total+'</span></div><div class="stage">'+inner+'</div></div>'}
const _stem=t=>t.length>4?t.replace(/(ing|ed|es|s)$/,''):t;
let _rel=null;
function relatedOf(x){
  if(x.t===VERB)return[];
  if(!_rel){_rel=new Map();const pre=ITEMS.filter(y=>y.t!==VERB).map(y=>({y,al:altsOf(y.en).map(a=>a.map(_stem))}));
    pre.forEach(({y,al})=>{const key=al[0]||[];if(key.length<2)return;const list=[];
      pre.forEach(o=>{if(o.y.id===y.id||o.y.en===y.en)return;
        const hay=o.al[0]||[];if(hay.length<=key.length)return;
        for(let i=0;i+key.length<=hay.length;i++){if(key.every((t,j)=>hay[i+j]===t)){list.push(o.y);return}}});
      _rel.set(y.id,list.slice(0,2))})}
  return _rel.get(x.id)||[];
}

function posLine(x){
  if(x.t!=='Từ mới')return'';
  const key0=x.en.toLowerCase().replace(/\s*=\s*$/,'').trim(),key=key0.replace(/\s*\(.*?\)\s*/g,' ').trim();
  if(POSNU[key0])return POSNU[key0];if(POSNU[key])return POSNU[key];
  if(POSX[key0])return POSX[key0];if(POSX[key])return POSX[key];
  const tail=(x.ipa||'').replace(/^.*\//,'').trim(),m=tail.match(/^(n|v|a|adj|adv|prep|conj|pron)\b(.*)$/i);
  if(m){const k=m[1].toLowerCase();return POSN[k]+(/P2/i.test(m[2])?' (dạng V3)':'')}
  return'';
}
function slotLine(x){
  if(x.t===VERB||x.t==='Từ mới')return'';
  const e=x.en.replace(/\\u0027/g,"'"),vi=promptVi(x),parts=[],add=t=>{if(t&&!parts.includes(t))parts.push(t)};
  if(/\b(sb|somebody|someone)\b/i.test(e))add('ai (sb)');
  if(/\b(sth|something)\b/i.test(e))add('việc / vật gì đó (sth)');
  if(/\bV-?ing\b/.test(e))add('động từ thêm -ing');
  if(/\bV-?ed\b|\bV2\b/.test(e))add('động từ dạng quá khứ (V2)');
  if(/\bV3\b/.test(e))add('động từ dạng V3');
  if(/\bto V(?![-\w])|(^|[\s+(,])V(?![-\w])/.test(e))add('động từ nguyên mẫu');
  if(/(^|[\s+(,])S(?![-\w])/.test(e))add('chủ ngữ');
  if(/\badj(-er)?\b/.test(e))add('tính từ');
  (e.match(/[^+/(),.?…]*[À-ỹ][^+/(),.?…]*/g)||[]).forEach(g=>{g=g.trim();if(g&&g.length<28&&!/[A-Za-z]{3,}/.test(g))add(g)});
  if(!parts.length)return'';
  const tellsSlot=/(^|\s)(ai|gì|việc|cái|người|nơi)(\s|$|[,.?)])/i.test(vi.replace(/\.\.\.|…/g,' '));
  return(/\.\.\.|…/.test(vi)||!tellsSlot)?parts.join(' · '):'';
}

function record(ok,extra){
  const it=S.queue[0],x=byId[it.id],p=ensureProg(x),t=today(),pb=p.b;
  if(it.first){
    if(ok){p.b=Math.min(4,p.b+1);p.d=t+INT[p.b];S.ok++;dayLog().ok++}
    else{p.b=0;p.d=t+1;S.bad++;S.wrongIds.add(x.id);dayLog().bad++}
  }
  if(it.first)p.u=Date.now();S.fb=Object.assign({ok,pb},extra||{});S.phase='fb';S.hint=0;save();render();
}

const SYNC_URL='https://sotaycumtu-default-rtdb.asia-southeast1.firebasedatabase.app';   // dán địa chỉ Realtime Database vào đây để khỏi phải nhập trên từng máy

const SYKEY='sotay_sync';
let SY=(()=>{try{return JSON.parse(localStorage.getItem(SYKEY))||{}}catch(e){return{}}})();
let syncState='',syncErr='',syncTimer=null,syncBusy=false,syncAgain=false;
const syncUrl=()=>String(SYNC_URL||SY.url||'').trim().replace(/\/+$/,'');

/* Firebase cấm . $ # [ ] / trong tên khóa: mã hóa khi gửi, giải mã khi nhận */
const encK=k=>String(k).replace(/[%.$#\[\]\/]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'));
const decK=k=>String(k).replace(/%([0-9A-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
const mapKeys=(o,f)=>{const r={};Object.keys(o||{}).forEach(k=>{r[f(k)]=o[k]});return r};
function mergeInto(local,remote){
  if(!remote||typeof remote!=='object')return false;
  const lr=local.resetAt||0,rr=remote.resetAt||0;
  if(lr>rr)return false;                       // máy này vừa xoá/khôi phục sau cùng: dữ liệu mạng cũ hơn, bỏ qua
  let changed=false;
  if(rr>lr){local.progress={};local.done={};local.log={};local.resetAt=rr;changed=true}
  const rp=remote.progress||{};
  for(const id in rp){const r=rp[id],l=local.progress[id];if(!l||(r.u||0)>(l.u||0)){local.progress[id]=r;changed=true}}
  for(const n in (remote.done||{}))if(!local.done[n]){local.done[n]=1;changed=true}
  const rl=remote.log||{};
  for(const k in rl){const a=local.log[k],b=rl[k];
    if(!a){local.log[k]=b;changed=true}
    else{const ok=Math.max(a.ok||0,b.ok||0),bad=Math.max(a.bad||0,b.bad||0);if(ok!==a.ok||bad!==a.bad){a.ok=ok;a.bad=bad;changed=true}}}
  return changed;
}
function syncSoon(){if(!syncOn())return;clearTimeout(syncTimer);setSync('busy');syncTimer=setTimeout(syncNow,1500)}
async function syncNow(){
  if(!syncOn())return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;setSync('busy');
  try{
    const r=await fetch(syncEndpoint(),{cache:'no-store'});if(!r.ok)throw new Error('GET '+r.status);
    const remote=await r.json();
    const changed=mergeInto(st,remote?Object.assign({},remote,{progress:mapKeys(remote.progress,decK)}):remote);
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
    const body=JSON.stringify({progress:mapKeys(st.progress,encK),done:st.done,log:st.log,resetAt:st.resetAt||0,savedAt:Date.now()});
    const w=await fetch(syncEndpoint(),{method:'PUT',body,headers:{'Content-Type':'application/json'}});if(!w.ok)throw new Error('PUT '+w.status);
    setSync('ok');
    if(changed&&!S)render();
  }catch(e){const m=String(e&&e.message||'');syncErr=/ (401|403)$/.test(m)?'chưa có quyền, kiểm tra Rules bên Firebase':/ 400$/.test(m)?'Firebase từ chối dữ liệu (400)':/ 404$/.test(m)?'sai địa chỉ Firebase':/ \d{3}$/.test(m)?'máy chủ báo lỗi '+m.slice(-3):'không kết nối được (mạng?)';setSync('err');clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,15000)}
  syncBusy=false;
  if(syncAgain){syncAgain=false;syncSoon()}
}

function syncPanel(){
  if(syncOn()&&SYNC_CODE)return '<div class="small"><b>Đồng bộ giữa các máy</b> <span class="mute">luôn bật</span><br><span class="mute">Máy nào mở trang này cũng dùng chung một tiến độ, không cần làm gì thêm.</span></div><div class="row" style="margin-top:8px"><button class="grow sm" data-a="syncnow">Đồng bộ ngay</button></div>';
  if(syncOn())return '<div class="small"><b>Đồng bộ giữa các máy</b> <span class="mute">đang bật</span><br>Mã của m (giữ kín): <span class="codebox">'+esc(SY.code)+'</span><br><span class="mute">Trên máy khác: mở mục này, nhập đúng mã trên rồi bấm Bật đồng bộ.</span></div><div class="row" style="margin-top:8px"><button class="grow sm" data-a="syncnow">Đồng bộ ngay</button><button class="grow sm" data-a="syncoff">Ngắt đồng bộ</button></div>';
  return '<div class="small"><b>Đồng bộ giữa các máy</b>'+(SYNC_URL?'':'<input type="text" id="syncUrl" placeholder="Địa chỉ Firebase Realtime Database" value="'+esc(SY.url||'')+'" style="margin:6px 0 0;min-height:40px;font-size:.95em" autocomplete="off" autocapitalize="none" spellcheck="false">')+
    '<input type="text" id="syncCode" placeholder="Mã đồng bộ (để trống = tạo mã mới)" style="margin:6px 0;min-height:40px;font-size:.95em" autocomplete="off" autocapitalize="none" spellcheck="false"></div><button class="pri big" data-a="syncon">Bật đồng bộ</button>';
}
function syncEnable(){
  const ue=$('#syncUrl'),ce=$('#syncCode');
  const url=String(SYNC_URL||(ue?ue.value:'')||SY.url||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\/[^\s/]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(url)){toast('Địa chỉ phải dạng https://…firebasedatabase.app');return}
  let code=ce?ce.value.trim():'';
  if(code&&!/^[A-Za-z0-9_-]{16,}$/.test(code)){toast('Mã phải từ 16 ký tự trở lên, chỉ gồm chữ và số');return}
  if(!code)code=newCode();
  SY={url,code};try{localStorage.setItem(SYKEY,JSON.stringify(SY))}catch(e){}
  toast('Đã bật đồng bộ');syncNow();render();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
window.addEventListener('online',()=>syncNow());

render();
syncNow();
</script>
</body>
</html>
