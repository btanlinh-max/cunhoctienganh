<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2447E8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cụm từ"></head><body>
<title>Sổ tay cụm từ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: một cột hẹp như trang vở bài tập; câu tiếng Việt lớn ở trên, chỗ trống tô vàng như vệt bút dạ quang ở dưới. */
:root{
  --bg:#EDF0F6; --card:#FFFFFF; --fg:#0F1A2E; --mute:#5A6781; --line:#D6DCE8;
  --accent:#2447E8; --accent-ink:#FFFFFF; --hi:#FFE066; --hi-ink:#3A2E00;
  --good:#0E8A5C; --good-bg:#E0F4EC; --bad:#CC3040; --bad-bg:#FCE7EA;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --card:#141C30; --fg:#E8EDF8; --mute:#93A0BC; --line:#26314A;
  --accent:#8AA4FF; --accent-ink:#0B1120; --hi:#F2C94C; --hi-ink:#2E2400;
  --good:#3DD6A0; --good-bg:#10332A; --bad:#FF7B86; --bad-bg:#3A1A21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --card:#141C30; --fg:#E8EDF8; --mute:#93A0BC; --line:#26314A;
  --accent:#8AA4FF; --accent-ink:#0B1120; --hi:#F2C94C; --hi-ink:#2E2400;
  --good:#3DD6A0; --good-bg:#10332A; --bad:#FF7B86; --bad-bg:#3A1A21; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;line-height:1.15;font-weight:800;margin:0;text-wrap:balance}
h2{font-size:1rem;font-weight:700;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.small{font-size:.8125rem}
.mono{font-family:var(--f-mono)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.text{background:none;color:var(--mute);padding:8px 10px;min-height:0;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:none;border-radius:9px;padding:10px 2px;font-weight:500;font-size:.875rem;white-space:nowrap;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.streak{font-family:var(--f-mono);font-weight:700;font-size:.875rem;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.big{font-size:2.75rem;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}
.sets{display:flex;flex-direction:column;gap:12px}
.set{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.set .bar{grid-column:1/-1}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.8125rem;color:var(--mute)}
/* session */
.top{display:flex;gap:12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1.5px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--mute)}
.chip.form{color:var(--accent);border-color:var(--accent)}
.chip.hint{text-transform:none;letter-spacing:0;font-family:var(--f-mono);color:var(--fg);background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.chip.warn{color:var(--bad);border-color:var(--bad)}
.vi{font-size:1.375rem;line-height:1.35;font-weight:700;text-wrap:balance}
.en{font-family:var(--f-mono);font-size:1.0625rem;line-height:1.75;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:5.5em;height:1.25em;vertical-align:text-bottom;background:var(--hi);border-radius:4px;margin:0 2px}
mark{background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:1px 5px;font-weight:700}
.v1{font-family:var(--f-mono);font-size:2rem;font-weight:700}
.fields{display:flex;flex-direction:column;gap:10px}
.f{display:flex;align-items:center;gap:10px}
.lb{font-family:var(--f-mono);font-weight:700;color:var(--mute);min-width:2.2em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.f.col{flex-direction:column;align-items:stretch;gap:4px}
.cue{font-family:var(--f-body);font-weight:500;font-size:.875rem;color:var(--fg)}
input.ans{flex:1;min-width:0;width:100%;font:500 1.0625rem var(--f-mono);color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
input.ans:focus{border-color:var(--accent);outline:none}
input.ans.ok{border-color:var(--good);background:var(--good-bg)}
input.ans.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb b.t{font-weight:800}
.fb.ok b.t{color:var(--good)}
.fb.no b.t{color:var(--bad)}
.trap{border-left:4px solid var(--hi);padding:4px 0 4px 12px}
.list{display:flex;flex-direction:column}
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.item:first-child{border-top:0}
.search{width:100%;resize:vertical;font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
.pill{font-family:var(--f-mono);font-size:.75rem;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.good{color:var(--good);border-color:var(--good)}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
footer{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}
@media (max-width:420px){.vi{font-size:1.25rem}.big{font-size:2.25rem}}
</style>

<div id="app"><p class="empty">Đang tải…</p></div>

<script>
(function(){
"use strict";
var DATA={"PA":{"title":"Động từ + giới từ / tiểu từ","order":1,"items":[{"id":"PA01","t":"f","ph":"look at","vi":"nhìn vào","a":["look at"],"ex":"Look at this dress.","trap":"look at = nhìn vào. Không dùng look to / look on.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA02","t":"f","ph":"look for","vi":"tìm kiếm","a":["look for","search for"],"ex":"I am looking for my keys.","trap":"look at = nhìn, look for = tìm. Lỗi hay gặp: nhầm hai cụm này.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA03","t":"f","ph":"look after","vi":"chăm sóc","a":["look after","take care of"],"ex":"She looks after her baby.","trap":"look after = chăm sóc (giống take care of).","tag":"Động từ + giới từ","set":"PA"},{"id":"PA04","t":"f","ph":"wait for","vi":"đợi ai / cái gì","a":["wait for"],"ex":"I waited for my husband.","trap":"wait luôn đi với for. Không viết wait my husband / wait to.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA05","t":"f","ph":"talk to / talk with","vi":"nói chuyện với","a":["talk to","talk with","speak to","speak with"],"ex":"I talked to my mother.","trap":"Không viết talk my mother. talk about mới là nói về.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA06","t":"f","ph":"listen to","vi":"nghe","a":["listen to"],"ex":"Listen to the teacher.","trap":"listen luôn có to. hear thì không cần to.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA07","t":"f","ph":"speak to / with","vi":"nói với","a":["speak to","speak with","talk to","talk with"],"ex":"Can I speak to you?","trap":"speak + to/with, không để trống.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA08","t":"f","ph":"talk about","vi":"nói về","a":["talk about"],"ex":"We talked about work.","trap":"nói về = talk about. Không dùng talk of / talk on.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA09","t":"f","ph":"think about","vi":"nghĩ về","a":["think about","think of"],"ex":"I am thinking about my future.","trap":"think about = nghĩ về. Không viết think of ở đây.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA10","t":"f","ph":"worry about","vi":"lo lắng về","a":["worry about"],"ex":"Don't worry about me.","trap":"worry about + người/việc. Không viết worry for / worry of.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA11","t":"f","ph":"ask for","vi":"xin, yêu cầu","a":["ask for"],"ex":"She asked for help.","trap":"ask for = xin, yêu cầu. Không viết ask help.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA12","t":"f","ph":"pay for","vi":"trả tiền cho","a":["pay for"],"ex":"I paid for the shirt.","trap":"pay for + món hàng. Không viết paid the shirt. Nhớ: pay-paid-paid.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA13","t":"f","ph":"arrive at","vi":"đến một địa điểm cụ thể","a":["arrive at","get to"],"ex":"I arrived at work.","trap":"arrive at = nơi cụ thể. Không viết arrive to.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA14","t":"f","ph":"arrive in","vi":"đến một thành phố / một nước","a":["arrive in","get to"],"ex":"She arrived in Hanoi.","trap":"arrive in = thành phố/nước. Không viết arrive to.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA15","t":"f","ph":"get to","vi":"đến nơi","a":["get to","arrive at","arrive in"],"ex":"I got to work at eight.","trap":"get to + nơi chốn. Không thêm at/in sau get.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA16","t":"f","ph":"go home / get home","vi":"về nhà / về đến nhà","a":["go home","get home"],"ex":"I got home late.","trap":"home không cần to: get home, go home. Không viết got to home.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA17","t":"f","ph":"go back to","vi":"quay lại một địa điểm","a":["go back to","return to"],"ex":"I went back to my hometown.","trap":"go back to + nơi chốn. Không viết go back at / go back in.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA18","t":"f","ph":"come from","vi":"đến từ","a":["come from"],"ex":"He comes from Vietnam.","trap":"comes (có s) + from. Không viết come to.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA19","t":"f","ph":"depend on","vi":"phụ thuộc vào","a":["depend on"],"ex":"It depends on the weather.","trap":"depend on, không viết depend of / depend in.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA20","t":"f","ph":"belong to","vi":"thuộc về","a":["belong to"],"ex":"This bag belongs to me.","trap":"belong + to. Không dùng dạng -ing.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA21","t":"f","ph":"agree with","vi":"đồng ý với","a":["agree with"],"ex":"I agree with you.","trap":"agree with + người. Không viết am agree.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA22","t":"f","ph":"prepare for","vi":"chuẩn bị cho","a":["prepare for"],"ex":"I prepared for the interview.","trap":"prepare for + sự kiện. Không viết prepare to.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA23","t":"f","ph":"look forward to + V-ing","vi":"mong chờ","a":["look forward to ving"],"ex":"I look forward to seeing you.","trap":"to ở đây là giới từ, nên theo sau là V-ing: seeing, không phải see.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA24","t":"f","ph":"call somebody","vi":"gọi điện cho ai","a":["call somebody","call somebody on the phone","phone somebody"],"ex":"She called me.","trap":"call + người, không có to. 'called to me' nghĩa là gọi to về phía tôi.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA25","t":"f","ph":"call somebody on the phone","vi":"gọi cho ai bằng điện thoại (nói rõ phương tiện)","a":["call somebody on the phone","call somebody","phone somebody"],"ex":"He called me on the phone.","trap":"on the phone, không viết by phone / with phone.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA26","t":"f","ph":"call for somebody","vi":"gọi / yêu cầu ai đến; đến đón ai","a":["call for somebody"],"ex":"The manager called for me.","trap":"call for = gọi/yêu cầu ai đến, hoặc đến đón. Khác với call somebody.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA27","t":"f","ph":"call somebody back","vi":"gọi lại cho ai","a":["call somebody back"],"ex":"I will call you back.","trap":"Đại từ đứng giữa: call you back. Không viết call back you.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA28","t":"f","ph":"put on","vi":"mặc / đeo vào","a":["put on"],"ex":"Put on your coat.","trap":"put on = hành động mặc vào. wear = đang mặc.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA29","t":"f","ph":"take off","vi":"cởi ra; cất cánh","a":["take off"],"ex":"Take off your shoes.","trap":"take off = cởi ra. Không viết take out.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA30","t":"f","ph":"try on","vi":"mặc thử","a":["try on"],"ex":"Can I try on this jacket?","trap":"try on = mặc thử. Không viết try wear.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA31","t":"f","ph":"match + noun","vi":"hợp với (nói về đồ vật, quần áo)","a":["match noun"],"ex":"This belt matches those shoes.","trap":"match không cần with. shoes là số nhiều nên dùng those.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA32","t":"f","ph":"go out","vi":"đi chơi / ra ngoài","a":["go out"],"ex":"We go out on weekends.","trap":"go out = đi chơi / ra ngoài.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA33","t":"f","ph":"get up","vi":"thức dậy, ra khỏi giường","a":["get up"],"ex":"I got up late.","trap":"get up = ra khỏi giường. wake up = tỉnh dậy.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA34","t":"f","ph":"give up","vi":"từ bỏ","a":["give up"],"ex":"I never give up.","trap":"never + động từ nguyên mẫu, không chia.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA35","t":"f","ph":"grow up","vi":"lớn lên","a":["grow up"],"ex":"She grew up in Hanoi.","trap":"grow-grew-grown. Ở đây là quá khứ đơn: grew.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA36","t":"f","ph":"find out","vi":"tìm ra, phát hiện","a":["find out"],"ex":"I found out the truth.","trap":"find out = tìm ra, phát hiện. find-found-found.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA37","t":"f","ph":"pick up","vi":"nhặt lên; đón","a":["pick up"],"ex":"I picked up my daughter.","trap":"pick up = nhặt lên / đón.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA38","t":"f","ph":"turn on","vi":"bật","a":["turn on"],"ex":"Turn on the light.","trap":"turn off = tắt.","tag":"Động từ + giới từ","set":"PA"},{"id":"PA39","t":"f","ph":"turn off","vi":"tắt","a":["turn off"],"ex":"Turn off the light.","trap":"turn off = tắt.","tag":"Động từ + giới từ","set":"PA"}]},"PB":{"title":"Cụm cố định và kết hợp từ","order":2,"items":[{"id":"PB01","t":"f","ph":"a pair of gloves","vi":"một đôi găng tay","a":["a pair of gloves"],"ex":"She bought a pair of gloves.","trap":"a pair of + danh từ số nhiều: gloves, không phải glove.","tag":"Cụm cố định","set":"PB"},{"id":"PB02","t":"f","ph":"a pair of shoes","vi":"một đôi giày","a":["a pair of shoes"],"ex":"I bought a pair of shoes.","trap":"a pair of shoes, không viết a shoes / a shoe pair.","tag":"Cụm cố định","set":"PB"},{"id":"PB03","t":"f","ph":"those shoes","vi":"những đôi giày kia (số nhiều)","a":["those shoes"],"ex":"Those shoes are black.","trap":"shoes là số nhiều: those shoes are. Không viết that shoes / this shoes is.","tag":"Cụm cố định","set":"PB"},{"id":"PB04","t":"f","ph":"a scarf","vi":"một chiếc khăn quàng","a":["a scarf"],"ex":"She is wearing a scarf.","trap":"một cái thì có a.","tag":"Cụm cố định","set":"PB"},{"id":"PB05","t":"f","ph":"scarves","vi":"nhiều chiếc khăn quàng (số nhiều)","a":["scarves"],"ex":"She has three scarves.","trap":"scarf đổi f thành ves: scarves.","tag":"Cụm cố định","set":"PB"},{"id":"PB06","t":"f","ph":"a suit","vi":"bộ vest","a":["a suit"],"ex":"He wore a suit.","trap":"wear-wore-worn. a suit = bộ vest.","tag":"Cụm cố định","set":"PB"},{"id":"PB07","t":"f","ph":"a suit jacket","vi":"áo vest (chỉ phần áo)","a":["a suit jacket"],"ex":"He wore a suit jacket.","trap":"","tag":"Cụm cố định","set":"PB"},{"id":"PB08","t":"f","ph":"a job interview","vi":"buổi phỏng vấn xin việc","a":["a job interview"],"ex":"She went to a job interview.","trap":"job interview = buổi phỏng vấn xin việc, có a.","tag":"Cụm cố định","set":"PB"},{"id":"PB09","t":"f","ph":"wear glasses","vi":"đeo kính","a":["wear glasses"],"ex":"I wear glasses.","trap":"glasses luôn số nhiều, không có a. Dùng wear, không dùng use.","tag":"Cụm cố định","set":"PB"},{"id":"PB10","t":"f","ph":"brush my teeth","vi":"đánh răng","a":["brush my teeth"],"ex":"I brush my teeth twice a day.","trap":"brush my teeth, teeth là số nhiều của tooth. Không dùng wash/clean.","tag":"Cụm cố định","set":"PB"},{"id":"PB11","t":"f","ph":"cut my nails","vi":"cắt móng tay","a":["cut my nails"],"ex":"I cut my nails every week.","trap":"cut my nails. Không dùng cut my fingers.","tag":"Cụm cố định","set":"PB"},{"id":"PB12","t":"f","ph":"weigh + number + at birth","vi":"nặng bao nhiêu khi sinh (nói cân nặng cụ thể)","a":["weigh … at birth"],"ex":"She weighed 3 kg at birth.","trap":"weigh là động từ: weighed 3 kg. Không viết was 3 kg weight.","tag":"Cụm cố định","set":"PB"},{"id":"PB13","t":"f","ph":"How much did ... weigh at birth?","vi":"lúc sinh ... nặng bao nhiêu?","a":["how much did … weigh at birth"],"ex":"How much did she weigh at birth?","trap":"did + weigh (nguyên mẫu), không viết did weighed.","tag":"Cụm cố định","set":"PB"},{"id":"PB14","t":"f","ph":"How heavy was ...?","vi":"... nặng bao nhiêu? (hỏi cân nặng)","a":["how heavy was …","how heavy is …"],"ex":"How heavy was the baby?","trap":"How heavy + was. Không viết how much heavy.","tag":"Cụm cố định","set":"PB"},{"id":"PB15","t":"f","ph":"be born on + date","vi":"sinh vào ngày","a":["be born on …","was born on …"],"ex":"She was born on May 6.","trap":"be born luôn đi với was/were. Có ngày cụ thể thì dùng on.","tag":"Cụm cố định","set":"PB"},{"id":"PB16","t":"f","ph":"be born in + month/year","vi":"sinh vào tháng / năm","a":["be born in …","was born in …"],"ex":"He was born in 2020.","trap":"năm/tháng dùng in. Không viết born at.","tag":"Cụm cố định","set":"PB"},{"id":"PB17","t":"f","ph":"get married","vi":"kết hôn (hành động)","a":["get married","got married"],"ex":"She got married in 2022.","trap":"get married = hành động kết hôn. Không viết married with / married to ở đây.","tag":"Cụm cố định","set":"PB"},{"id":"PB18","t":"f","ph":"be married","vi":"đã có gia đình (trạng thái)","a":["be married"],"ex":"She is married.","trap":"be married = trạng thái đã kết hôn.","tag":"Cụm cố định","set":"PB"},{"id":"PB19","t":"f","ph":"be widowed","vi":"góa chồng / góa vợ","a":["be widowed"],"ex":"She was widowed young.","trap":"be widowed là bị động: was widowed.","tag":"Cụm cố định","set":"PB"},{"id":"PB20","t":"f","ph":"a widow","vi":"người góa (danh từ)","a":["a widow"],"ex":"She is a widow.","trap":"","tag":"Cụm cố định","set":"PB"},{"id":"PB21","t":"f","ph":"be separated","vi":"ly thân","a":["be separated"],"ex":"They are separated.","trap":"be separated = ly thân.","tag":"Cụm cố định","set":"PB"},{"id":"PB22","t":"f","ph":"be divorced","vi":"ly hôn","a":["be divorced","get divorced"],"ex":"They are divorced.","trap":"","tag":"Cụm cố định","set":"PB"},{"id":"PB23","t":"f","ph":"hold a wedding","vi":"tổ chức đám cưới","a":["hold a wedding"],"ex":"They held a wedding at home.","trap":"bị động: was held. hold-held-held.","tag":"Cụm cố định","set":"PB"},{"id":"PB24","t":"f","ph":"a wedding was held","vi":"đám cưới được tổ chức","a":["a wedding was held","the wedding was held"],"ex":"The wedding was held at home.","trap":"bị động: was held. hold-held-held.","tag":"Cụm cố định","set":"PB"},{"id":"PB25","t":"f","ph":"die of a heart attack","vi":"qua đời vì đau tim","a":["die of a heart attack","die of"],"ex":"He died of a heart attack.","trap":"die of + nguyên nhân. Không viết die by.","tag":"Cụm cố định","set":"PB"},{"id":"PB26","t":"f","ph":"spend time with somebody","vi":"dành thời gian bên ai","a":["spend time with somebody"],"ex":"I spend time with my family.","trap":"spend time with + người. Không viết spend time to.","tag":"Cụm cố định","set":"PB"},{"id":"PB27","t":"f","ph":"spend time + V-ing","vi":"dành thời gian làm gì","a":["spend time ving"],"ex":"I spent time talking to her.","trap":"spend time + V-ing. Không viết spent time to talk.","tag":"Cụm cố định","set":"PB"},{"id":"PB28","t":"f","ph":"take care of","vi":"chăm sóc","a":["take care of","look after"],"ex":"I take care of my children.","trap":"take care of + người. Không viết take care for.","tag":"Cụm cố định","set":"PB"},{"id":"PB29","t":"f","ph":"make friends with","vi":"kết bạn với","a":["make friends with"],"ex":"She makes friends with others.","trap":"friends luôn số nhiều: make friends with.","tag":"Cụm cố định","set":"PB"},{"id":"PB30","t":"f","ph":"be in a hurry","vi":"đang vội","a":["be in a hurry"],"ex":"I was in a hurry.","trap":"be in a hurry. Không viết be hurry.","tag":"Cụm cố định","set":"PB"},{"id":"PB31","t":"f","ph":"arrive late / be late","vi":"đến muộn / bị muộn","a":["arrive late","be late"],"ex":"She arrived late.","trap":"arrive late, không thêm at/in.","tag":"Cụm cố định","set":"PB"},{"id":"PB32","t":"f","ph":"on time","vi":"đúng giờ","a":["on time"],"ex":"I got to work on time.","trap":"on time = đúng giờ. in time = kịp lúc.","tag":"Cụm cố định","set":"PB"},{"id":"PB33","t":"f","ph":"every day","vi":"mỗi ngày","a":["every day"],"ex":"I study every day.","trap":"every day (2 chữ) = mỗi ngày. everyday (1 chữ) = hằng ngày, dùng trước danh từ.","tag":"Cụm cố định","set":"PB"},{"id":"PB34","t":"f","ph":"everyday + noun","vi":"(tính từ) thường ngày","a":["everyday","everyday noun"],"ex":"I wear everyday clothes.","trap":"everyday viết liền khi đứng trước danh từ.","tag":"Cụm cố định","set":"PB"},{"id":"PB35","t":"f","ph":"today","vi":"hôm nay","a":["today"],"ex":"Today I am busy.","trap":"today không có in/on/at đứng trước.","tag":"Cụm cố định","set":"PB"},{"id":"PB36","t":"f","ph":"yesterday","vi":"hôm qua","a":["yesterday"],"ex":"Yesterday I stayed at home.","trap":"yesterday dùng với quá khứ đơn. Không có in/on đứng trước.","tag":"Cụm cố định","set":"PB"},{"id":"PB37","t":"f","ph":"tomorrow","vi":"ngày mai","a":["tomorrow"],"ex":"Tomorrow I will go to work.","trap":"tomorrow dùng với tương lai. Không có in/on đứng trước.","tag":"Cụm cố định","set":"PB"},{"id":"PB38","t":"f","ph":"at home","vi":"ở nhà","a":["at home"],"ex":"I stayed at home.","trap":"at home. Không viết in home / in the home.","tag":"Cụm cố định","set":"PB"},{"id":"PB39","t":"f","ph":"in the countryside","vi":"ở vùng nông thôn","a":["in the countryside"],"ex":"They live in the countryside.","trap":"in the countryside, có the.","tag":"Cụm cố định","set":"PB"},{"id":"PB40","t":"f","ph":"at the supermarket","vi":"ở siêu thị","a":["at the supermarket"],"ex":"I met her at the supermarket.","trap":"at + địa điểm thông thường. Nhớ the.","tag":"Cụm cố định","set":"PB"},{"id":"PB41","t":"f","ph":"on weekends / at weekends","vi":"vào cuối tuần","a":["on weekends","at weekends"],"ex":"We go out on weekends.","trap":"weekends có s khi nói chung chung, lặp lại.","tag":"Cụm cố định","set":"PB"},{"id":"PB42","t":"f","ph":"twice a day","vi":"hai lần một ngày","a":["twice a day"],"ex":"I brush my teeth twice a day.","trap":"twice a day. Không viết two times in a day.","tag":"Cụm cố định","set":"PB"}]},"PC":{"title":"Cấu trúc động từ và tính từ","order":3,"items":[{"id":"PC01","t":"f","ph":"prefer V-ing to V-ing","vi":"thích làm A hơn làm B","a":["prefer ving to ving"],"ex":"I prefer wearing jeans to wearing dresses.","trap":"prefer A to B, không dùng than. Cả hai vế đều là V-ing.","tag":"Cấu trúc","set":"PC"},{"id":"PC02","t":"f","ph":"enjoy + V-ing","vi":"thích làm gì","a":["enjoy ving"],"ex":"She enjoys reading.","trap":"enjoy + V-ing. Không viết enjoy to read.","tag":"Cấu trúc","set":"PC"},{"id":"PC03","t":"f","ph":"practice + V-ing","vi":"luyện làm gì","a":["practice ving"],"ex":"I practice speaking English.","trap":"practice + V-ing. Không viết practice to speak.","tag":"Cấu trúc","set":"PC"},{"id":"PC04","t":"f","ph":"be busy + V-ing","vi":"bận làm gì","a":["be busy ving"],"ex":"I am busy cooking.","trap":"busy + V-ing, không có at/in/to.","tag":"Cấu trúc","set":"PC"},{"id":"PC05","t":"f","ph":"be scared of + V-ing","vi":"sợ làm gì","a":["be scared of ving"],"ex":"I am scared of making mistakes.","trap":"scared of + V-ing. Sau of không dùng to. Chú ý: make a mistake.","tag":"Cấu trúc","set":"PC"},{"id":"PC06","t":"f","ph":"be proud of","vi":"tự hào về","a":["be proud of"],"ex":"I am proud of myself.","trap":"proud of, không viết proud about / proud with.","tag":"Cấu trúc","set":"PC"},{"id":"PC07","t":"f","ph":"be satisfied with","vi":"hài lòng với","a":["be satisfied with"],"ex":"She is satisfied with her work.","trap":"satisfied with, không viết satisfied of.","tag":"Cấu trúc","set":"PC"},{"id":"PC08","t":"f","ph":"be good at + V-ing","vi":"giỏi làm gì","a":["be good at ving"],"ex":"He is good at drawing.","trap":"good at + V-ing. Không viết good in / good on.","tag":"Cấu trúc","set":"PC"},{"id":"PC09","t":"f","ph":"want to V","vi":"muốn làm gì","a":["want to v"],"ex":"I want to learn English.","trap":"want + to + V. Không viết want learn.","tag":"Cấu trúc","set":"PC"},{"id":"PC10","t":"f","ph":"need to V","vi":"cần làm gì","a":["need to v"],"ex":"I need to rest.","trap":"want + to + V. Không viết want learn.","tag":"Cấu trúc","set":"PC"},{"id":"PC11","t":"f","ph":"try to V","vi":"cố gắng làm gì","a":["try to v"],"ex":"I try to study every day.","trap":"want + to + V. Không viết want learn.","tag":"Cấu trúc","set":"PC"},{"id":"PC12","t":"f","ph":"ask somebody to V","vi":"nhờ ai làm gì","a":["ask sb to v"],"ex":"She asked me to help.","trap":"tell + O + to V. tell-told-told.","tag":"Cấu trúc","set":"PC"},{"id":"PC13","t":"f","ph":"tell somebody to V","vi":"bảo ai làm gì","a":["tell sb to v"],"ex":"He told me to rest.","trap":"tell + O + to V. tell-told-told.","tag":"Cấu trúc","set":"PC"},{"id":"PC14","t":"f","ph":"help somebody (to) V","vi":"giúp ai làm gì","a":["help sb v","help sb to v"],"ex":"She helped me cook.","trap":"help + O + V hoặc to V đều được.","tag":"Cấu trúc","set":"PC"},{"id":"PC15","t":"f","ph":"let somebody + V","vi":"để / cho phép ai làm gì","a":["let sb v"],"ex":"My husband let me rest.","trap":"let + O + V nguyên mẫu, không có to. let-let-let.","tag":"Cấu trúc","set":"PC"},{"id":"PC16","t":"f","ph":"make somebody + V","vi":"khiến ai làm gì","a":["make sb v"],"ex":"The news made me cry.","trap":"make + O + V nguyên mẫu, không có to. make-made-made.","tag":"Cấu trúc","set":"PC"},{"id":"PC17","t":"f","ph":"make somebody feel + adjective","vi":"khiến ai cảm thấy thế nào","a":["make sb feel adj"],"ex":"It made me feel peaceful.","trap":"make + O + feel + tính từ.","tag":"Cấu trúc","set":"PC"},{"id":"PC18","t":"f","ph":"too + adjective + to V","vi":"quá ... để làm gì","a":["too adj to v"],"ex":"This coat is too thick to wear.","trap":"too + adj + to V. Không viết for wear, không thêm not.","tag":"Cấu trúc","set":"PC"},{"id":"PC19","t":"f","ph":"used to + V","vi":"đã từng thường làm gì (thói quen trong quá khứ)","a":["used to v"],"ex":"I used to live there.","trap":"used to + V nguyên mẫu. Không viết use to live / used to living.","tag":"Cấu trúc","set":"PC"},{"id":"PC20","t":"f","ph":"when + past simple, past continuous","vi":"khi một việc xảy ra, việc khác đang diễn ra","a":["when past simple past continuous"],"ex":"I was cooking when he called.","trap":"việc đang diễn ra dùng quá khứ tiếp diễn; việc chen vào dùng quá khứ đơn (called).","tag":"Cấu trúc","set":"PC"},{"id":"PC21","t":"f","ph":"while + past continuous","vi":"trong khi đang làm gì","a":["while past continuous"],"ex":"While I was waiting, she arrived.","trap":"while + quá khứ tiếp diễn. Không dùng while + quá khứ đơn.","tag":"Cấu trúc","set":"PC"},{"id":"PC22","t":"f","ph":"thanks to + noun","vi":"nhờ vào","a":["thanks to noun"],"ex":"Thanks to her help, I improved.","trap":"thanks to + danh từ. Không viết thanks for help.","tag":"Cấu trúc","set":"PC"},{"id":"PC23","t":"f","ph":"although + clause","vi":"mặc dù","a":["although clause"],"ex":"Although I was tired, I studied.","trap":"although + mệnh đề đầy đủ (có chủ ngữ + động từ). Không thêm but ở vế sau.","tag":"Cấu trúc","set":"PC"},{"id":"PC24","t":"f","ph":"not only ... but also ...","vi":"không chỉ ... mà còn ...","a":["not only … but also …"],"ex":"She is not only kind but also patient.","trap":"hai vế cùng loại từ: kind và patient đều là tính từ.","tag":"Cấu trúc","set":"PC"}]},"D":{"title":"Động từ bất quy tắc","order":4,"items":[{"id":"D01","t":"v","ph":"be","v1":"be","vi":"thì, là, ở","a2":["was","were","was/were","was / were"],"a3":["been"],"grp":"Đặc biệt","tag":"V2 và V3","trap":"","set":"D","added":"2026-11-03","c2":"đã là / ở (quá khứ đơn)","c3":"đã là / ở rồi (have/has + V3)"},{"id":"D02","t":"v","ph":"begin","v1":"begin","vi":"bắt đầu","a2":["began"],"a3":["begun"],"grp":"i - a - u","tag":"V2 và V3","trap":"","set":"D","added":"2026-11-03","c2":"đã bắt đầu (quá khứ đơn)","c3":"đã bắt đầu rồi (have/has + V3)"},{"id":"D03","t":"v","ph":"break","v1":"break","vi":"làm vỡ","a2":["broke"],"a3":["broken"],"grp":"V3 thêm -n / -en","tag":"V2 và V3","trap":"","set":"D","added":"2026-11-03","c2":"đã làm vỡ (quá khứ đơn)","c3":"đã làm vỡ rồi (have/has + V3)"},{"id":"D04","t":"v","ph":"bring","v1":"bring","vi":"mang đến","a2":["brought"],"a3":["brought"],"grp":"V2 = V3","tag":"V2 và V3","trap":"","set":"D","added":"2026-11-03","c2":"đã mang đến (quá khứ đơn)","c3":"đã mang đến rồi (have/has + V3)"},{"id":"D05","t":"v","ph":"buy","v1":"buy","vi":"mua","a2":["bought"],"a3":["bought"],"grp":"V2 = V3","tag":"V2 và V3","trap":"","set":"D","added":"2026-11-03","c2":"đã mua (quá khứ đơn)","c3":"đã mua rồi (have/has + V3)"},{"id":"D06","t":"v","ph":"choose","v1":"choose","vi":"chọn","a2":["chose"],"a3":["chosen"],"grp":"V3 thêm -n / -en","tag":"V2 và V3","trap":"","set":"D","added":"2026-11-03","c2":"đã chọn (quá khứ đơn)","c3":"đã chọn rồi (have/has + V3)"},{"id":"D07","t":"v","ph":"come","v1":"come","vi":"đến","a2":["came"],"a3":["come"],"grp":"V3 = V1","tag":"V2 và V3","trap":"","set":"D","added":"2026-11-03","c2":"đã đến (quá khứ đơn)","c3":"đã đến rồi (ha var $app=document.getElementById("app");
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var pad=function(n){return (n<10?"0":"")+n};
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- state ---------- */
var cards=[], byId={}, setMeta={};
var S_={s:{},days:{},u:0};          // s[id] = [sai, đúng, chuỗi đúng, ngày sai gần nhất]
var statsRef=null, cardsReady=false, statsReady=false, loadFailed="";
var view="home", tab="home";
var sess=null;

function st(id){return S_.s[id]||[0,0,0,""]}
function mastered(id){var x=S_.s[id];return !!x&&x[2]>=3}
function isErr(id){var x=S_.s[id];return !!x&&x[0]>0&&x[2]<3}
function errCards(){return cards.filter(function(c){return isErr(c.id)}).sort(function(a,b){return st(b.id)[0]-st(a.id)[0]})}

/* ---------- save / sync ---------- */
var dirty=false,saving=false,timer=null,syncState="";
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=syncLabel()}
function syncLabel(){return syncState==="ok"?"Đã đồng bộ":syncState==="pending"?"Đang lưu…":syncState==="err"?"Chưa đồng bộ được, sẽ thử lại":syncState==="local"?"Tiến độ lưu trên máy này":""}
function markDirty(){S_.u=Date.now();lsSet("cp_stats",JSON.stringify(S_));dirty=true;clearTimeout(timer);timer=setTimeout(flush,1200);setSync(statsRef?"pending":"local")}
async function flush(){
  if(!statsRef||saving||!dirty)return;
  saving=true;dirty=false;
  try{await statsRef.set({s:S_.s,days:S_.days,u:S_.u});setSync(dirty?"pending":"ok")}
  catch(e){dirty=true;setSync("err");clearTimeout(timer);timer=setTimeout(flush,5000)}
  saving=false;
  if(dirty&&syncState!=="err"){clearTimeout(timer);timer=setTimeout(flush,800)}
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flush()});

/* ---------- grading ---------- */
function norm(s){return String(s||"").toLowerCase().replace(/[‘’`]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"").trim()}
function accepted(c){return c.t==="v"?[c.a2,c.a3]:[c.a]}
function labels(c){return c.t==="v"?["V2","V3"]:[""]}
function nf(s){return String(s||"").toLowerCase().replace(/[‘’`]/g,"'").replace(/\.{2,}|…/g,"…").replace(/[+,;?!()]/g," ").replace(/\b(somebody|someone|sb|smb|me|you|him|her|them|us)\b/g,"sb").replace(/\bv[\s_-]*ing\b|\bverb[\s_-]*ing\b/g,"ving").replace(/\b(adjective|adj)\b/g,"adj").replace(/…/g," … ").replace(/\s+/g," ").trim().replace(/\.$/,"").trim()}
function matchOne(c,i,val){
  var accs=accepted(c)[i];
  if(c.t==="f"){
    var v=nf(val);if(!v)return false;
    return accs.some(function(a){var n=nf(a);if(n.indexOf("…")<0)return n===v;
      var re=new RegExp("^"+n.split("…").map(function(x){return x.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join(".+")+"$");return re.test(v)});
  }
  var w=norm(val);if(c.set==="S")w=w.replace(/^(just|already|recently|finally|really)\s+/,"");
  return !!w&&accs.map(norm).indexOf(w)>=0;
}
function grade(c,vals){return accepted(c).map(function(a,i){return matchOne(c,i,vals[i])})}
function fullEn(c){return c.t==="v"?c.v1+", "+c.a2[0]+", "+c.a3[0]:c.t==="f"?c.ex:c.en.replace("___",c.a[0])}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- views ---------- */
function streak(){
  var n=0,d=new Date();
  if(!S_.days[dkey(d)])d.setDate(d.getDate()-1);
  while(S_.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function tabsHTML(){
  var t=[["home","Hôm nay"],["err","Lỗi"],["store","Kho"],["data","Dữ liệu"]];
  return '<div class="tabs" role="tablist">'+t.map(function(x){return '<button class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+(x[0]==="err"&&cardsReady&&errCards().length?" ("+errCards().length+")":"")+'</button>'}).join("")+'</div>';
}
function footHTML(){return '<footer><span id="sync">'+syncLabel()+'</span><span>'+cards.length+' câu</span></footer>'}
function head(){return '<div class="row between"><h1>Sổ tay cụm từ</h1><span class="streak" title="Số ngày liên tiếp học đủ một lượt">'+streak()+' ngày liên tiếp</span></div>'}

function render(){
  if(view==="sess"||view==="sum")return;
  if(loadFailed){$app.innerHTML=head()+'<p class="empty">'+esc(loadFailed)+'</p>';return}
  if(!cardsReady||!statsReady){$app.innerHTML=head()+'<p class="empty">Đang tải kho cụm…</p>';return}
  if(!cards.length){$app.innerHTML=head()+'<p class="empty">Kho cụm đang trống. Vào tab Dữ liệu để nhập cụm.</p>';return}
  if(tab==="home")renderHome();else if(tab==="err")renderErr();else if(tab==="data")renderData();else renderStore();
  $app.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}});
}

function renderHome(){
  var core=cards.filter(function(c){return !c.opt}),nOpt=cards.length-core.length;
  var n=core.length,mins=Math.max(1,Math.round(n*7/60)),done=!!S_.days[dkey()],errs=errCards().length;
  var groups={};core.forEach(function(c){var g=groups[c.set]||(groups[c.set]={n:0,m:0});g.n++;if(mastered(c.id))g.m++});
  var keys=Object.keys(groups).sort(function(a,b){return (setMeta[a].order||0)-(setMeta[b].order||0)});
  var tot=core.filter(function(c){return mastered(c.id)}).length;
  $app.innerHTML=head()+tabsHTML()+
   '<section class="card"><div class="row between"><div><div class="big">'+n+'</div><div class="mute small">câu cho lượt hôm nay, khoảng '+mins+' phút</div></div>'+
   (done?'<span class="pill good">Hôm nay xong rồi</span>':'')+'</div>'+
   '<button class="btn block" id="go">'+(done?"Học lại một lượt":"Bắt đầu lượt hôm nay")+'</button>'+
   (errs?'<button class="btn ghost block" id="goErr">Chỉ ôn '+errs+' câu hay sai</button>':'')+
   (nOpt?'<button class="btn ghost block" id="goOpt">Luyện thêm: V2 hay V3 trong câu ('+nOpt+')</button>':'')+
   '<p class="small mute">Đọc nghĩa tiếng Việt, gõ công thức tiếng Anh, ví dụ <b class="mono">spend time with</b>. Dấu + và chữ hoa, chữ thường không tính. Gõ somebody hoặc sb đều được, V-ing hoặc ving đều được. Sai thì câu đó quay lại sau vài câu.</p></section>'+
   '<section class="card"><div class="row between"><h2>Đã vững</h2><span class="num">'+tot+' / '+n+'</span></div><div class="sets">'+
   keys.map(function(k){var g=groups[k];return '<div class="set"><span>'+esc(setMeta[k].title)+'</span><span class="num">'+g.m+' / '+g.n+'</span><div class="bar good"><i style="width:'+Math.round(g.m/g.n*100)+'%"></i></div></div>'}).join("")+
   '</div><p class="small mute">Một câu tính là vững khi trả lời đúng ngay lần đầu 3 lượt liên tiếp.</p></section>'+footHTML();
  document.getElementById("go").onclick=function(){start("all")};
  var ge=document.getElementById("goErr");if(ge)ge.onclick=function(){start("err")};
  var go=document.getElementById("goOpt");if(go)go.onclick=function(){start("opt")};
}

function renderErr(){
  var list=errCards();
  var seen=cards.filter(function(c){return st(c.id)[0]>0}).length;
  $app.innerHTML=head()+tabsHTML()+
   (list.length?'<section class="card"><div class="row between"><h2>'+list.length+' câu chưa vững</h2><span class="num">đã từng sai: '+seen+'</span></div>'+
   '<button class="btn block" id="goErr">Ôn các câu này</button><div class="list">'+list.map(function(c){var x=st(c.id);
   return '<div class="item"><div class="row between"><b class="mono">'+esc(c.ph)+'</b><span class="pill bad">sai '+x[0]+' lần</span></div><span class="mute">'+esc(c.vi||c.v1)+'</span>'+(c.trap?'<span class="small trap">'+esc(c.trap)+'</span>':'')+'</div>'}).join("")+'</div></section>'
   :'<p class="empty">Chưa có câu nào đang sai. Làm một lượt hôm nay rồi các câu sai sẽ hiện ở đây.</p>')+footHTML();
  var ge=document.getElementById("goErr");if(ge)ge.onclick=function(){start("err")};
}

function renderStore(){
  $app.innerHTML=head()+tabsHTML()+'<input class="search" id="q" type="search" placeholder="Tìm cụm hoặc nghĩa…" autocomplete="off"><div id="sl" class="sets"></div>'+footHTML();
  var q=document.getElementById("q");
  var paint=function(){
    var t=norm(q.value),keys=Object.keys(setMeta).sort(function(a,b){return setMeta[a].order-setMeta[b].order});
    document.getElementById("sl").innerHTML=keys.map(function(k){
      var items=cards.filter(function(c){return c.set===k&&(!t||(c.ph+" "+(c.vi||"")+" "+(c.v1||"")).toLowerCase().indexOf(t)>=0)});
      if(!items.length)return "";
      return '<details'+(t?" open":"")+'><summary><span>'+esc(setMeta[k].title)+'</span><span class="pill">'+items.length+'</span></summary><div class="list">'+items.map(function(c){var x=st(c.id);
        var ans=c.t==="v"?c.v1+" – "+c.a2[0]+" – "+c.a3[0]:c.t==="f"?c.ph:c.a.join(" / ");
        return '<div class="item"><div class="row between"><b class="mono">'+esc(c.ph)+'</b>'+(x[0]?'<span class="pill bad">sai '+x[0]+'</span>':mastered(c.id)?'<span class="pill good">vững</span>':'')+'</div><span class="mute">'+esc(c.vi)+'</span><span class="mono small">'+esc(ans)+'</span></div>'}).join("")+'</div></details>'}).join("")||'<p class="empty">Không có kết quả.</p>';
  };
  q.oninput=paint;paint();
}

/* ---------- session ---------- */
function start(mode,only){
  var ids;
  if(only){ids=only}
  else if(mode==="err"){ids=errCards().map(function(c){return c.id})}
  else if(mode==="opt"){ids=cards.filter(function(c){return c.opt}).map(function(c){return c.id})}
  else ids=cards.filter(function(c){return !c.opt}).map(function(c){return c.id});
  if(!ids.length)return;
  ids=shuffle(ids);
  var q=ids.map(function(id){return {id:id,retry:false,again:false}});
  var extra=ids.filter(function(id){var c=byId[id];return mode==="err"||isErr(id)||(c.n&&!mastered(id))});
  extra=shuffle(extra);
  var half=Math.floor(q.length/2);
  extra.forEach(function(id){var pos=half+Math.floor(Math.random()*(q.length-half+1));q.splice(pos,0,{id:id,retry:false,again:true})});
  sess={mode:mode,queue:q,total:q.length,answered:0,first:0,firstOk:0,wrong:{},t0:Date.now(),cur:null,phase:"ask"};
  view="sess";next();
}
function next(){
  if(!sess.queue.length){finish();return}
  sess.cur=sess.queue.shift();sess.phase="ask";renderQ();
}
function progress(){var left=sess.queue.length+(sess.phase==="ask"?1:0);var d=sess.answered,t=d+left;return {d:d,t:t,p:t?Math.round(d/t*100):0}}
function topHTML(){var p=progress();return '<div class="top"><button class="btn text" id="quit">Thoát</button><div class="bar"><i style="width:'+p.p+'%"></i></div><span class="num">'+p.d+' / '+p.t+'</span></div>'}
function inputsHTML(c,pre,vals){
  var ls=labels(c);
  var cu=c.t==="v"?[c.c2,c.c3]:[];
  return '<div class="fields">'+ls.map(function(l,i){return '<label class="f'+(cu[i]?' col':'')+'">'+(l?'<span class="lb"><b>'+l+'</b>'+(cu[i]?'<span class="cue">'+esc(cu[i])+'</span>':'')+'</span>':'')+'<input class="ans" id="'+pre+i+'" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" value="'+esc(vals&&vals[i]||"")+'" aria-label="Câu trả lời '+l+'"></label>'}).join("")+'</div>';
}
function chipsHTML(x){
  var c=byId[x.id];
  return '<div class="chips"><span class="chip form">'+esc(c.tag)+'</span>'+(c.h?'<span class="chip hint">dùng: '+esc(c.h)+'</span>':'')+(c.t==="v"?'<span class="chip">'+esc(c.grp)+'</span>':'')+(x.retry?'<span class="chip warn">làm lại câu vừa sai</span>':x.again?'<span class="chip warn">hay sai</span>':'')+'</div>';
}
function promptHTML(c){
  if(c.t==="v")return '<div class="v1">'+esc(c.v1)+'</div><p class="vi">'+esc(c.vi)+'</p>';
  if(c.t==="f")return '<p class="vi">'+esc(c.vi)+'</p><p class="small mute">Gõ công thức tiếng Anh</p>';
  return '<p class="vi">'+esc(c.vi)+'</p><p class="en">'+esc(c.en).replace("___",'<span class="blank"></span>')+'</p>';
}
function wireQuit(){var q=document.getElementById("quit");if(q)q.onclick=function(){if(sess&&sess.answered>0)flush();sess=null;view="home";render()}}

function renderQ(){
  var x=sess.cur,c=byId[x.id];
  $app.innerHTML=topHTML()+'<section class="card">'+chipsHTML(x)+promptHTML(c)+inputsHTML(c,"a")+
   '<div class="row"><button class="btn" id="chk" style="flex:1">Kiểm tra</button><button class="btn ghost" id="dk">Không nhớ</button></div></section>';
  wireQuit();
  var n=labels(c).length,ins=[];for(var i=0;i<n;i++)ins.push(document.getElementById("a"+i));
  ins.forEach(function(el,i){el.addEventListener("keydown",function(e){if(e.key!=="Enter")return;e.preventDefault();if(i<n-1)ins[i+1].focus();else submit(ins.map(function(z){return z.value}))})});
  document.getElementById("chk").onclick=function(){submit(ins.map(function(z){return z.value}))};
  document.getElementById("dk").onclick=function(){submit(ins.map(function(){return ""}),true)};
  ins[0].focus();
}

function submit(vals,skip){
  if(sess.phase!=="ask")return;
  var x=sess.cur,c=byId[x.id];
  if(!skip&&!vals.some(function(v){return norm(v)}))return;
  var res=grade(c,vals),ok=res.every(Boolean);
  sess.phase="fb";sess.answered++;
  if(!x.retry){
    var s=S_.s[c.id]||(S_.s[c.id]=[0,0,0,""]);
    if(!x.again||!sess.wrong[c.id]){}
    if(ok){s[1]++;s[2]++}else{s[0]++;s[2]=0;s[3]=dkey()}
    sess.first++;if(ok)sess.firstOk++;
    markDirty();
  }
  if(!ok){
    sess.wrong[c.id]=(sess.wrong[c.id]||0)+1;
    if(x.retry){sess.queue.splice(Math.min(sess.queue.length,3),0,{id:c.id,retry:true,again:false})}
    else{
      sess.queue.splice(Math.min(sess.queue.length,4),0,{id:c.id,retry:true,again:false});
      sess.queue.splice(Math.min(sess.queue.length,11),0,{id:c.id,retry:true,again:false});
    }
  }
  renderFB(vals,res,ok,skip);
}

function renderFB(vals,res,ok,skip){
  var x=sess.cur,c=byId[x.id],ls=labels(c),acc=accepted(c);
  var fields=ls.map(function(l,i){
    var cue=c.t==="v"?[c.c2,c.c3][i]:"";
    return '<div class="f'+(cue?' col':'')+'">'+(l?'<span class="lb"><b>'+l+'</b>'+(cue?'<span class="cue">'+esc(cue)+'</span>':'')+'</span>':'')+'<input class="ans '+(res[i]?"ok":"no")+'" value="'+esc(vals[i]||"")+'" readonly aria-label="Bạn đã gõ"></div>';
  }).join("");
  var right=c.t==="v"
    ? '<div class="mono">'+esc(c.v1)+' – <mark>'+esc(c.a2[0])+'</mark> – <mark>'+esc(c.a3[0])+'</mark></div>'
    : c.t==="f" ? '<div class="mono en"><mark>'+esc(c.ph)+'</mark></div>'
    : '<div class="mono en">'+esc(c.en).replace("___","<mark>"+esc(c.a[0])+"</mark>")+'</div>';
  var alt=(c.t==="p"&&c.a.length>1)?'<div class="small mute">Cũng đúng: '+esc(c.a.slice(1).join(" / "))+'</div>':(c.t==="f"?(function(){var o=c.a.filter(function(x){return nf(c.ph).indexOf(nf(x))<0&&x.indexOf("\u2026")<0&&!/\b(ving|adj|sb|noun|v)\b/.test(x)});return o.length?'<div class="small mute">Cũng đúng: '+esc(o.join(" / "))+'</div>':""})():"");
  var phr=c.t==="v"?"":c.t==="f"?'<div class="small mute">Ví dụ: <span class="mono">'+esc(c.ex)+'</span></div>':'<div class="small mute">Cụm: <b class="mono">'+esc(c.ph)+'</b></div>';
  var trap=c.trap?'<div class="trap small"><b>Bẫy:</b> '+esc(c.trap)+'</div>':"";
  var body=
   '<section class="card">'+chipsHTML(x)+(c.t==="v"?promptHTML(c):'<p class="vi">'+esc(c.vi)+'</p>')+
   '<div class="fields">'+fields+'</div>'+
   '<div class="fb '+(ok?"ok":"no")+'"><b class="t">'+(ok?"Đúng":(skip?"Đáp án":"Sai"))+'</b>'+(ok?"":right)+(ok?right:"")+alt+phr+'</div>'+trap;
  if(ok){
    body+='<div class="row"><button class="btn" id="nx" style="flex:1">Tiếp tục</button><button class="btn ghost" id="say">Nghe</button></div></section>';
    $app.innerHTML=topHTML()+body;
    wireQuit();
    document.getElementById("say").onclick=function(){speak(fullEn(c))};
    document.getElementById("nx").onclick=next;
    document.getElementById("nx").focus();
  }else{
    body+='<p class="small mute">Gõ lại đáp án đúng một lần rồi mới sang câu tiếp.</p>'+inputsHTML(c,"r")+
     '<div class="row"><button class="btn" id="nx" style="flex:1" disabled>Tiếp tục</button><button class="btn ghost" id="say">Nghe</button></div></section>';
    $app.innerHTML=topHTML()+body;
    wireQuit();
    document.getElementById("say").onclick=function(){speak(fullEn(c))};
    var n=ls.length,ins=[];for(var i=0;i<n;i++)ins.push(document.getElementById("r"+i));
    var nx=document.getElementById("nx");
    var okAll=function(){return acc.every(function(a,i){return matchOne(c,i,ins[i].value)})};
    var upd=function(){nx.disabled=!okAll()};
    ins.forEach(function(el,i){
      el.addEventListener("input",upd);
      el.addEventListener("keydown",function(e){if(e.key!=="Enter")return;e.preventDefault();if(i<n-1)ins[i+1].focus();else if(okAll())next()});
    });
    nx.onclick=function(){if(okAll())next()};
    ins[0].focus();
  }
}

function finish(){
  var wrongIds=Object.keys(sess.wrong);
  if(sess.mode==="all"){S_.days[dkey()]=true;markDirty()}
  flush();
  var secs=Math.round((Date.now()-sess.t0)/1000),acc=sess.first?Math.round(sess.firstOk/sess.first*100):0;
  var s=sess;sess=null;view="sum";
  $app.innerHTML='<div class="row between"><h1>Xong lượt này</h1><span class="streak">'+streak()+' ngày liên tiếp</span></div>'+
   '<section class="card"><div class="row" style="gap:28px"><div><div class="big">'+acc+'%</div><div class="mute small">đúng ngay lần đầu ('+s.firstOk+'/'+s.first+')</div></div><div><div class="big">'+Math.floor(secs/60)+'’'+pad(secs%60)+'</div><div class="mute small">thời gian</div></div></div></section>'+
   (wrongIds.length?'<section class="card"><h2>'+wrongIds.length+' câu bị sai trong lượt này</h2><div class="list">'+wrongIds.map(function(id){var c=byId[id];
    return '<div class="item"><div class="row between"><b class="mono">'+esc(c.ph)+'</b><span class="pill bad">sai '+s.wrong[id]+' lần</span></div><span class="mute">'+esc(c.vi)+'</span>'+(c.trap?'<span class="small trap">'+esc(c.trap)+'</span>':"")+'</div>'}).join("")+'</div>'+
    '<button class="btn block" id="again">Ôn lại ngay những câu này</button></section>'
   :'<section class="card"><p>Không sai câu nào. Mai làm lại để giữ trí nhớ.</p></section>')+
   '<button class="btn ghost block" id="home">Về trang chủ</button>';
  document.getElementById("home").onclick=function(){view="home";tab="home";render()};
  var ag=document.getElementById("again");if(ag)ag.onclick=function(){start("err",wrongIds)};
}

/* ---------- boot ---------- */
function rebuild(docs){
  var list=[];setMeta={};
  docs.forEach(function(d){var v=d.data()||{};setMeta[d.id]={title:v.title||d.id,order:v.order||99,opt:!!v.opt};(v.items||[]).forEach(function(it){it.set=d.id;it.opt=!!v.opt;list.push(it)})});
  var order=Object.keys(setMeta).sort(function(a,b){return setMeta[a].order-setMeta[b].order});
  list.sort(function(a,b){return order.indexOf(a.set)-order.indexOf(b.set)});
  cards=list;byId={};cards.forEach(function(c){byId[c.id]=c});
  cardsReady=true;
}
function loadExtra(){try{return JSON.parse(lsGet("cp_extra")||"{}")||{}}catch(e){return {}}}
function allDocs(){
  var m={};Object.keys(DATA).forEach(function(k){m[k]=DATA[k]});
  var ex=loadExtra();Object.keys(ex).forEach(function(k){m[k]=ex[k]});
  return Object.keys(m).map(function(k){return {id:k,data:function(){return m[k]}}});
}
function b64e(o){return "CP1."+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function b64d(t){return JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))))}
function renderData(){
  $app.innerHTML=head()+tabsHTML()+
   '<section class="card"><h2>Chuyển sang máy khác</h2><p class="small mute">Bấm Tạo mã, chép cả đoạn mã, sang máy kia dán vào ô bên dưới rồi bấm Nhập. Mã gồm tiến độ và các cụm đã thêm.</p>'+
   '<div class="row"><button class="btn" id="mk">Tạo mã</button><button class="btn ghost" id="cp" disabled>Sao chép</button></div>'+
   '<textarea class="search mono small" id="out" rows="3" readonly placeholder="Mã sẽ hiện ở đây" aria-label="Mã tiến độ"></textarea></section>'+
   '<section class="card"><h2>Nhập mã hoặc thêm cụm mới</h2><p class="small mute">Dán mã từ máy khác, hoặc khối cụm mới do Claude gửi. Nhập mã sẽ gộp với tiến độ đang có, không xóa gì.</p>'+
   '<textarea class="search mono small" id="inp" rows="4" placeholder="Dán vào đây" aria-label="Dán mã"></textarea>'+
   '<button class="btn" id="imp">Nhập</button><p class="small" id="msg" role="status"></p></section>'+
   '<section class="card"><h2>Xóa tiến độ</h2><p class="small mute">Đưa mọi câu về trạng thái chưa học. Các cụm đã thêm vẫn giữ.</p><button class="btn ghost" id="rst">Xóa tiến độ</button></section>'+footHTML();
  $app.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}});
  var out=document.getElementById("out"),cp=document.getElementById("cp"),msg=document.getElementById("msg");
  document.getElementById("mk").onclick=function(){out.value=b64e({s:S_.s,days:S_.days,extra:loadExtra()});cp.disabled=false;out.focus();out.select()};
  cp.onclick=function(){out.select();var done=function(){cp.textContent="Đã sao chép"};try{navigator.clipboard.writeText(out.value).then(done,function(){try{document.execCommand("copy");done()}catch(e){}})}catch(e){try{document.execCommand("copy");done()}catch(z){}}};
  document.getElementById("imp").onclick=function(){
    var t=document.getElementById("inp").value.trim();if(!t){return}
    try{
      if(t.indexOf("CP1.")===0){
        var o=b64d(t);
        Object.keys(o.s||{}).forEach(function(id){var a=S_.s[id],b=o.s[id];if(!a||(b[0]+b[1])>(a[0]+a[1]))S_.s[id]=b});
        Object.keys(o.days||{}).forEach(function(d){S_.days[d]=true});
        var ex=loadExtra();Object.keys(o.extra||{}).forEach(function(k){ex[k]=o.extra[k]});lsSet("cp_extra",JSON.stringify(ex));
        markDirty();msg.textContent="Đã nhập tiến độ.";
      }else{
        var d=JSON.parse(t);if(!d||!d.id||!Array.isArray(d.items))throw 0;
        var ex2=loadExtra();ex2[d.id]={title:d.title||d.id,order:d.order||50,items:d.items};lsSet("cp_extra",JSON.stringify(ex2));
        msg.textContent="Đã thêm "+d.items.length+" câu vào bộ \u201c"+(d.title||d.id)+"\u201d.";
      }
      rebuild(allDocs());document.getElementById("inp").value="";
    }catch(e){msg.textContent="Mã không đọc được. Kiểm tra xem đã dán đủ cả đoạn chưa."}
  };
  var rs=document.getElementById("rst"),armed=false;
  rs.onclick=function(){if(!armed){armed=true;rs.textContent="Bấm lần nữa để xóa thật";return}S_={s:{},days:{},u:Date.now()};lsSet("cp_stats",JSON.stringify(S_));render()};
}
function boot(){
  try{var loc=JSON.parse(lsGet("cp_stats")||"null");if(loc&&loc.s){S_=loc}}catch(e){}
  rebuild(allDocs());statsReady=true;setSync("local");render();
}
boot();
})();
