<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a2e;--mute:#66757a;--line:#e3ded3;--pri:#0f6b5c;--pri-ink:#fff;--ok:#1b7f4b;--ok-soft:#dff3e7;--bad:#b3392f;--bad-soft:#fbe5e2;--warn:#8a5a00;--warn-soft:#fdf0d5;--r:14px;
  --fs:clamp(14px,min(2.7vh,4.4vw),23px)}
@media (prefers-color-scheme:dark){:root{--bg:#121719;--card:#1b2326;--ink:#e8eeef;--mute:#9db0b4;--line:#2b383c;--pri:#3dbba4;--pri-ink:#06211c;--ok:#59d08d;--ok-soft:#173826;--bad:#ff8d82;--bad-soft:#3d1f1c;--warn:#f0b64a;--warn-soft:#3a2d10}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
/* Một màn hình, không cuộn: khung cao đúng bằng cửa sổ; chỉ cuộn bên trong khi màn hình quá thấp */
.wrap{height:100vh;height:100dvh;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto;scrollbar-width:thin}
h1{font-size:1.3em;margin:0;line-height:1.2}h3{font-size:1.05em;margin:0 0 .4em}
.mute{color:var(--mute)}.small{font-size:.88em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(10px,2vh,18px);margin:0}
button,select{font:inherit;color:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:.5em .9em;min-height:max(42px,2.5em)}
button{cursor:pointer}button:hover{border-color:var(--pri)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:650}
.big{width:100%;min-height:max(46px,2.8em);font-size:1.05em}
.sm{min-height:36px;padding:.15em .7em;font-size:.88em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1 1 130px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);transition:width .25s}
.prompt{font-size:1.45em;font-weight:700;line-height:1.3;margin:.3em 0}
.ans{font-size:1.3em;font-weight:700;margin:.2em 0;overflow-wrap:anywhere}
input[type=text]{font:inherit;font-size:1.15em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5em .7em;width:100%;min-height:max(46px,2.7em)}
.fb{border-radius:12px;padding:.6em .9em;margin:0}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.hint{background:var(--warn-soft);color:var(--warn);padding:.5em .8em;border-radius:12px;margin:.4em 0}
.tag{display:inline-block;font-size:.75em;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--mute);margin-right:4px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5em .2em;text-align:center}
.stat b{display:block;font-size:1.35em;line-height:1.2}.stat span{font-size:.8em;color:var(--mute)}
ul.w{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:.5em 0 0;padding:0}
ul.w li{background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:1px 10px;font-size:.85em;overflow-wrap:anywhere}
ul.w li.more{background:none;color:var(--mute)}
.home{flex:1;min-height:0;display:flex;flex-direction:column;gap:inherit}
.col{display:flex;flex-direction:column;gap:inherit;min-height:0}
@media (orientation:landscape) and (min-width:760px){.home{display:grid;grid-template-columns:1.05fr .95fr;align-content:center;align-items:start;gap:20px}}
.sess{flex:1;min-height:0;display:flex;flex-direction:column;gap:inherit}
.sess>.row.top{flex:none;flex-wrap:nowrap}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:inherit;width:100%;max-width:760px;margin:0 auto;overflow-y:auto;scrollbar-width:thin}
.stage>:first-child{margin-top:auto}.stage>:last-child{margin-bottom:auto}
details.pop{position:relative;flex:none}
details.pop>summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--mute);list-style:none}
details.pop>summary::-webkit-details-marker{display:none}
.popbody{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,420px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:20}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;font-size:.95em}
</style>
</head>

<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const dayStr=n=>new Date(n*86400000).toISOString().slice(0,10);
let toastT;function toast(m){const t=$('#toast');t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',2600)}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

/* ===== Lưu trữ =====
   progress[id] = {b: bậc nhớ 0-4, d: ngày ôn kế tiếp, l: ngày đã xong gần nhất}  */
const KEY='sotay_v1';let storageOK=true;
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){storageOK=false;return{}}}
const st=Object.assign({progress:{},done:{},log:{}},loadState());
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){storageOK=false}}

/* ===== Dữ liệu ===== */
const INT=[0,1,3,7,14];           // sau lần đúng đầu tiên: bậc 1 → mai, 2 → 3 ngày, 3 → 7 ngày, 4 → 14 ngày
const VERB='Động từ bất quy tắc';
const idOf=en=>en.toLowerCase().replace(/[‘’']/g,"'").replace(/\s+/g,' ').trim();
const ITEMS=(window.ITEMS||[]).map((x,i)=>({...x,id:x.d+'|'+idOf(x.en),i}));
const byId={};ITEMS.forEach(x=>{byId[x.id]=x});

function setupExtras(){ // chạy sau khi các hàm chấm đã được định nghĩa
  ITEMS.forEach(x=>{if(EDIT[x.id])x.vi=EDIT[x.id]});
  ITEMS.forEach(x=>{
    if(x.t===VERB)return;const own=new Set(altsOf(x.en).map(a=>a.join(' ')));
    SAME.forEach(g=>{const keys=g.map(m=>tokens(m).join(' '));
      if(keys.some(k=>own.has(k))){x.xm=(x.xm||[]).concat(g.filter((m,i)=>!own.has(keys[i])));x.xa=(x.xa||[]).concat(g.flatMap(m=>altsOf(m)))}});
  });
  VERBS=new Set(ITEMS.filter(x=>x.t===VERB).map(x=>x.en.split(/\s*[-\/]\s*/)[0].trim().toLowerCase()));
  'go get take make spend look ask tell live stay meet hold call wait try need want enjoy stop start keep give hang talk speak say see come find bring leave turn put work play study help buy sell open close cook clean wash write read watch listen learn teach use visit lose win pay pass check join move send show share wear ride drive fall'.split(' ').forEach(v=>VERBS.add(v));
}
function formOf(x){
  if(x.t===VERB||x.t==='Từ mới')return'';
  const e=x.en.replace(/\\u0027/g,"'").toLowerCase(),sl=e.includes(' / ');
  if(/\bhave\s*\/\s*has been\b|\bhas been\b|\bhave been \+?\s*v-?ing/.test(e))return'hiện tại hoàn thành tiếp diễn';
  if(/\bhave you (ever|\+ v3)|\bhaven'?t\b.*v3|have\s*\/\s*has \+ v3/.test(e))return'hiện tại hoàn thành';
  if(/\b(was|were)\b.*\bv3\b|\bwhy was\b/.test(e))return'bị động quá khứ (was/were + V3)';
  if(/^be born\b|^born\b/.test(e))return'quá khứ: was / were born';
  if(/^if i were/.test(e))return'câu điều kiện loại 2';
  if(!sl&&/\b(was|were|had)\b|\bv2\b/.test(e))return'quá khứ đơn';
  if(/\bbe\s*\+\s*v-?ing|^be going\b|\bis \+ v-?ing/.test(e))return'hiện tại tiếp diễn (be + V-ing)';
  if(/\b(does|do|doesn'?t|don'?t)\b|\bs \+ has\b/.test(e))return'hiện tại đơn';
  if(/^(be|am|is|are)\b/.test(e))return'hiện tại đơn, bắt đầu bằng be';
  if(/^have\b/.test(e)&&!/^have you/.test(e))return'hiện tại đơn, bắt đầu bằng have';
  if(VERBS.has(e.split(/\s+/)[0]))return'động từ nguyên mẫu';
  return'';
}
const prog=id=>st.progress[id];
const dayLog=()=>{const k=dayStr(today());return st.log[k]||(st.log[k]={ok:0,bad:0})};
const DAYS=[1,2,3,4,5,6,7];
const dueOf=n=>ITEMS.filter(x=>{const p=prog(x.id);return x.d!==n&&p&&p.d<=today()&&p.l!==today()});
const dayOf=n=>ITEMS.filter(x=>x.d===n&&!(prog(x.id)&&prog(x.id).l===today()));

/* ===== Chấm đáp án ===== */
const VI_RX=/[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
const PH=new Set('sb sth somebody someone something s o v noun adj adjective number date gian danh'.split(' '));
const CONTR=[[/\b(do|does|did|is|are|was|were|have|has|had|would|should|could)\s+not\b/g,'$1nt'],[/\bcan\s*not\b/g,'cant'],[/\bwill\s+not\b/g,'wont'],
 [/\bi\s+am\b/g,'im'],[/\bit\s+is\b/g,'its'],[/\bthat\s+is\b/g,'thats'],[/\bwhat\s+is\b/g,'whats'],[/\blet\s+us\b/g,'lets'],[/\bhe\s+is\b/g,'hes'],[/\bshe\s+is\b/g,'shes'],[/\byou\s+are\b/g,'youre'],[/\bthey\s+are\b/g,'theyre']];
function tokens(s){
  s=s.toLowerCase().replace(/[‘’]/g,"'").replace(/\bv\s*-?\s*ing\b/g,' ving ').replace(/\bv-?ed\b|\bv[123]\b/g,' ').replace(/'/g,'');
  CONTR.forEach(([r,t])=>{s=s.replace(r,t)});
  return s.split(/[^\p{L}\p{N}]+/u).filter(t=>t&&!PH.has(t)&&!VI_RX.test(t));
}
function altsOf(en){
  const s=en.replace(/…|\.\.\./g,' ');let variants=[s];
  const m=s.match(/\(([^)]*)\)/);
  if(m){const without=s.replace(m[0],' ');variants=VI_RX.test(m[1])?[without]:[without,s.replace(m[0],m[1])]}
  const out=[],seen=new Set();
  variants.forEach(v=>v.split(/\s\/\s/).forEach(a=>{const t=tokens(a);if(t.length){const k=t.join(' ');if(!seen.has(k)){seen.add(k);out.push(t)}}}));
  variants.forEach(v=>{const t=tokens(v.replace(/\//g,' '));if(t.length){const k=t.join(' ');if(!seen.has(k)){seen.add(k);out.push(t)}}});
  return out;
}
function verbAlts(en){
  const segs=en.split(/\s+-\s+/).map(sg=>sg.split(/\s*\/\s*/).map(w=>tokens(w).join(' ')).filter(Boolean));
  if(!segs.length||segs.some(x=>!x.length))return[];
  let combos=[[]];segs.forEach(opts=>{const nx=[];combos.forEach(c=>opts.forEach(o=>nx.push(c.concat(o.split(' ')))));combos=nx});
  combos.push(segs.map(o=>o.join(' ')).join(' ').split(' '));
  return combos;
}
const hasPH=en=>/[+]|\bsb\b|\bsth\b|\bV\b|\bS\b|ing\b|\.\.\.|…/.test(en)||VI_RX.test(en);
function isSubseq(a,u){let i=0;for(const t of u){if(t===a[i])i++;if(i===a.length)return true}return false}
function checkAnswer(it,inp){
  const alts=it.t===VERB?verbAlts(it.en):altsOf(it.en).concat(it.xa||[]);
  if(!alts.length)return{self:true};
  const u=tokens(inp);if(!u.length)return{empty:true};
  const uj=u.join(' ');
  if(alts.some(a=>a.join(' ')===uj))return{ok:true};
  if(it.t!==VERB&&hasPH(it.en)&&alts.some(a=>isSubseq(a,u)&&u.length-a.length<=3))return{ok:true,extra:true};
  return{ok:false};
}
const promptVi=it=>it.vi.split(/\.?\s*Lưu ý:/)[0].replace(/\([^)]*[A-Za-z]{3}[^)]*\)/g,'').replace(/\s+/g,' ').trim();
const noteVi=it=>{const m=it.vi.match(/Lưu ý:\s*(.*)$/);return m?m[1]:''};
function hintText(it){
  const a=(it.t===VERB?verbAlts(it.en):altsOf(it.en))[0];if(!a)return'';
  return a.map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join(' ');
}

/* ===== Giọng đọc ===== */
let voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));voice=vs.find(v=>/Google US English|Aria|Jenny|Zira|Samantha|Natural/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function speak(text){
  if(!('speechSynthesis' in window)){toast('Trình duyệt này không có giọng đọc');return}
  speechSynthesis.cancel();const t=text.split(/\s\/\s/)[0].replace(/\(.*?\)/g,' ').replace(/[+]|\bsb\b|\bsth\b|\bV-ing\b|\bV\b/g,' ').replace(/\s+/g,' ').trim();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u);
}

/* ===== Trang chính ===== */
let S=null,DAYPICK=null;
function streak(){let n=0,t=today();const had=d=>{const l=st.log[dayStr(d)];return l&&(l.ok+l.bad)>0};if(!had(t))t--;while(had(t)){n++;t--}return n}
function nextDay(){for(const n of DAYS)if(!st.done[n])return n;return 7}
function render(){
  if(!ITEMS.length){$('#view').innerHTML='<div class="card">Chưa có dữ liệu.</div>';return}
  if(S)renderSession();else vHome($('#view'));
}
function vHome(v){
  if(DAYPICK==null)DAYPICK=nextDay();
  const n=DAYPICK,nd=dayOf(n).length,due=dueOf(n).length,all=dueOf(0).length;
  const c={new:0,lrn:0,mas:0};ITEMS.forEach(x=>{const p=prog(x.id);if(!p)c.new++;else if(p.b>=4)c.mas++;else c.lrn++});
  const wrong=ITEMS.filter(x=>{const p=prog(x.id);return p&&p.b===0});
  const s=streak();
  v.innerHTML=(storageOK?'':'<div class="hint">⚠️ Trình duyệt đang chặn lưu dữ liệu, tiến độ sẽ mất khi đóng trang.</div>')+
  '<div class="topbar"><h1>🧩 Sổ tay cụm từ</h1>'+(s?'<span class="tag w">🔥 '+s+' ngày liền</span>':'')+'</div>'+
  '<div class="home"><div class="col">'+
  '<section class="card"><h3>Hôm nay học ngày nào?</h3><div class="row"><select id="dayPick" aria-label="Chọn ngày">'+
   DAYS.map(d=>'<option value="'+d+'"'+(n===d?' selected':'')+'>Ngày '+d+(st.done[d]?' ✓':'')+'</option>').join('')+'</select><span class="mute small grow">'+nd+' mục của ngày '+n+' + '+due+' mục ôn lại từ các ngày trước</span></div>'+
   '<div style="height:10px"></div><button class="pri big" data-a="start">▶ Bắt đầu ôn ngày '+n+'</button>'+
   (all?'<div style="height:8px"></div><button class="big" data-a="reviewonly">Chỉ ôn lại mục đến hạn ('+all+')</button>':'')+
  '</section>'+
  '<div class="stats"><div class="stat"><b>'+c.new+'</b><span>chưa học</span></div><div class="stat"><b>'+c.lrn+'</b><span>đang học</span></div><div class="stat"><b>'+c.mas+'</b><span>đã chắc</span></div></div>'+
  '</div><div class="col">'+
  (wrong.length?'<section class="card"><b>Đang hay sai ('+wrong.length+')</b><ul class="w">'+wrong.slice(0,12).map(x=>'<li>'+esc(x.en)+'</li>').join('')+(wrong.length>12?'<li class="more">… và '+(wrong.length-12)+' mục nữa</li>':'')+'</ul></section>':'<section class="card mute small">Chưa có mục nào đang hay sai.</section>')+
  '<details class="pop"><summary>⚙️ Sao lưu tiến độ</summary><div class="popbody"><p class="small mute" style="margin-top:0">Tiến độ lưu trong trình duyệt của máy này. Đổi máy thì tải file sao lưu rồi khôi phục ở máy mới.</p><div class="row"><button class="grow" data-a="export">⬇️ Tải file sao lưu</button><button class="grow" data-a="importpick">⬆️ Khôi phục từ file</button><input type="file" id="importFile" accept=".json" hidden></div><div style="height:8px"></div><button data-a="resetall" style="color:var(--bad)">Xoá toàn bộ tiến độ</button></div></details>'+
  '</div></div>';
  const f=$('#importFile');if(f)f.addEventListener('change',e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.progress!=='object')throw 0;Object.assign(st,d);save();toast('Đã khôi phục tiến độ');render()}catch(x){toast('File không hợp lệ')}};r.readAsText(fl)});
}

/* ===== Phiên ôn ===== */
function startDay(n){
  const rev=shuffle(dueOf(n)),neu=shuffle(n?dayOf(n):[]);
  const queue=rev.concat(neu).map(x=>({id:x.id,first:true}));
  if(!queue.length){toast('Hôm nay không còn mục nào để ôn 🎉');return}
  S={n,queue,total:queue.length,done:new Set(),ok:0,bad:0,wrongIds:new Set(),phase:'q',hint:0};render();window.scrollTo(0,0);
}
function ensureProg(x){let p=prog(x.id);if(!p)p=st.progress[x.id]={b:0,d:today()};return p}
function shell(inner){const pct=Math.round(100*S.done.size/S.total);
  return'<div class="sess"><div class="row top"><button class="sm" data-a="exit" aria-label="Thoát">✕</button><div class="grow"><div class="bar"><i style="width:'+pct+'%"></i></div></div><span class="small mute">'+S.done.size+'/'+S.total+'</span></div><div class="stage">'+inner+'</div></div>'}
function infoCard(x){
  return'<div class="ans">'+esc(x.en)+'</div><div>'+esc(promptVi(x))+'</div>'+(x.xm&&x.xm.length?'<div class="small mute" style="margin-top:4px">Cũng đúng: '+esc(x.xm.join(' · '))+'</div>':'')+(noteVi(x)?'<div class="small mute" style="margin-top:4px">Lưu ý: '+esc(noteVi(x))+'</div>':'')+
  '<div class="row" style="margin-top:8px;gap:6px"><span class="tag">'+esc(x.t)+'</span><span class="tag">Ngày '+x.d+'</span><button class="sm" data-a="say" data-t="'+esc(x.en)+'" aria-label="Nghe" style="margin-left:auto">🔊 Nghe</button></div>'}
function renderSession(){
  const v=$('#view');
  if(!S.queue.length){
    if(S.n)st.done[S.n]=1;DAYPICK=null;save();
    const tot=S.ok+S.bad,pct=tot?Math.round(100*S.ok/tot):100,w=[...S.wrongIds].map(id=>byId[id]);
    const wl=w.slice(0,10).map(x=>'<li>'+esc(x.en)+'</li>').join('')+(w.length>10?'<li class="more">… và '+(w.length-10)+' mục nữa</li>':'');
    v.innerHTML='<div class="sess"><div class="stage"><section class="card" style="text-align:center"><div style="font-size:2.2em;line-height:1.1">🎉</div><h1>Xong rồi!</h1><p style="margin:.3em 0 0">Đúng ngay lần đầu: <b>'+S.ok+'</b>/'+tot+' ('+pct+'%)</p></section>'+
     (w.length?'<section class="card"><b>Mục sai hôm nay ('+w.length+')</b><ul class="w">'+wl+'</ul><p class="small mute" style="margin:.5em 0 0">Mấy mục này sẽ quay lại vào ngày mai.</p></section>':'<p class="mute" style="text-align:center;margin:0">Mai app sẽ cho ôn lại các mục đã học.</p>')+
     '<button class="pri big" data-a="exit">Về trang chính</button></div></div>';return}
  const it=S.queue[0],x=byId[it.id];if(!x){S.queue.shift();renderSession();return}
  if(S.phase==='fb'){v.innerHTML=shell(feedbackHtml(x));const nb=$('#nextBtn');if(nb)nb.focus();return}
  const retry=it.first?'':'<span class="tag w">làm lại</span>';
  if(S.phase==='self'){
    v.innerHTML=shell('<section class="card"><span class="tag">'+esc(x.t)+'</span>'+retry+'<div class="prompt">'+esc(promptVi(x))+'</div><div class="fb ok" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">'+infoCard(x)+'</div><p class="mute small">Bạn nhớ đúng công thức này chứ?</p><div class="row"><button class="pri grow" data-a="selfok">✓ Nhớ đúng</button><button class="grow" data-a="selfbad">✗ Chưa nhớ</button></div></section>');return}
  if(checkAnswer(x,'x').self){
    v.innerHTML=shell('<section class="card"><span class="tag">'+esc(x.t)+'</span>'+retry+'<div class="prompt">'+esc(promptVi(x))+'</div><p class="mute small">Công thức ngữ pháp: nhớ hoặc viết ra giấy, rồi bấm hiện đáp án để tự chấm.</p><button class="pri big" data-a="reveal">Hiện đáp án</button></section>');return}
  const hint=S.hint?'<div class="hint">'+esc(hintText(x))+'</div>':'';
  v.innerHTML=shell('<section class="card"><span class="tag">'+esc(x.t)+'</span>'+retry+'<div class="prompt">'+esc(promptVi(x))+'</div>'+(x.t===VERB?'<div class="small mute">Gõ 3 dạng: V1 - V2 - V3</div>':formLine(x))+hint+
    '<input type="text" id="ans" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Gõ tiếng Anh…" style="margin-top:10px">'+
    '<div class="row" style="margin-top:12px"><button class="pri grow" data-a="check">Kiểm tra</button><button data-a="hint">💡 Gợi ý</button><button data-a="giveup">Không nhớ</button></div></section>');
  const inp=$('#ans');if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();actions.check()}})}
}
function formLine(x){const f=formOf(x);return f?'<div class="small mute">Dạng: <b>'+esc(f)+'</b></div>':''}
function feedbackHtml(x){
  const f=S.fb;
  const head=f.ok?(f.near?'Gần đúng — chú ý chính tả!':f.extra?'Đúng rồi! 👏 (bạn thêm từ cho đủ câu)':'Đúng rồi! 👏'):(f.given?'Chưa đúng. Bạn gõ: <b>'+esc(f.given)+'</b>':'Không sao, nhớ lại nhé');
  return'<div class="fb '+(f.ok?'ok':'bad')+'"><b>'+head+'</b></div><section class="card">'+infoCard(x)+'</section>'+
    '<button class="pri big" id="nextBtn" data-a="next">Tiếp tục</button>';
}
/* lần trả lời đầu tiên quyết định lịch ôn các ngày sau; các lần làm lại chỉ để nhớ trong buổi */
function record(ok,extra){
  const it=S.queue[0],x=byId[it.id],p=ensureProg(x),t=today();
  if(it.first){
    if(ok){p.b=Math.min(4,p.b+1);p.d=t+INT[p.b];S.ok++;dayLog().ok++}
    else{p.b=0;p.d=t+1;S.bad++;S.wrongIds.add(x.id);dayLog().bad++}
  }
  S.fb=Object.assign({ok},extra||{});S.phase='fb';S.hint=0;save();render();
}
const actions={
  start:()=>startDay(DAYPICK),
  reviewonly:()=>startDay(0),
  exit:()=>{S=null;render();window.scrollTo(0,0)},
  say:el=>speak(el.dataset.t),
  hint:()=>{S.hint=1;const a=$('#ans'),val=a?a.value:'';render();const b=$('#ans');if(b){b.value=val;b.focus()}},
  check:()=>{const x=byId[S.queue[0].id],inp=$('#ans');if(!inp)return;const r=checkAnswer(x,inp.value);if(r.empty){inp.focus();return}record(!!r.ok,{near:r.near,extra:r.extra,given:inp.value})},
  giveup:()=>record(false,{}),
  reveal:()=>{S.phase='self';render()},
  selfok:()=>{S.phase='q';record(true,{self:true})},
  selfbad:()=>{S.phase='q';record(false,{self:true})},
  next:()=>{
    const f=S.fb,it=S.queue.shift(),x=byId[it.id];
    if(f.ok){
      if(it.first)clear(it,x);
      else{it.need=(it.need==null?2:it.need)-1;if(it.need<=0)clear(it,x);else S.queue.splice(Math.min(5,S.queue.length),0,it)}
    }else S.queue.splice(Math.min(3,S.queue.length),0,{id:it.id,first:false,need:2});
    S.phase='q';render();window.scrollTo(0,0)},
  export:()=>{const b=new Blob([JSON.stringify(st)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='so-tay-cum-'+dayStr(today())+'.json';document.body.appendChild(a);a.click();a.remove()},
  importpick:()=>$('#importFile').click(),
  resetall:()=>{if(confirm('Xoá toàn bộ tiến độ học? Không thể hoàn tác.')){st.progress={};st.done={};st.log={};save();DAYPICK=null;render()}}
};
function clear(it,x){S.done.add(x.id);ensureProg(x).l=today();save()}
setupExtras();
document.addEventListener('change',e=>{if(e.target.id==='dayPick'){DAYPICK=Number(e.target.value);render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=actions[el.dataset.a];if(f)f(el,e)});
document.addEventListener('keydown',e=>{if(S&&S.phase==='fb'&&e.key==='Enter'&&document.activeElement&&document.activeElement.id!=='nextBtn'){e.preventDefault();actions.next()}});
render();
</script>
